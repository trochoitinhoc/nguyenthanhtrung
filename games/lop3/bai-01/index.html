<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Đập Túi Mù - Lớp 3</title>
    
    <style>
        :root {
            --cute-pink: #ffb3c6;
            --cute-pink-dark: #ff8fab;
            --cute-blue: #bde0fe;
            --cute-blue-dark: #a2d2ff;
            --cute-green: #d8f3dc;
            --cute-green-dark: #b7e4c7;
            --cute-yellow: #fdf0d5;
            --cute-yellow-dark: #f3d596;
            --text-dark: #4a4e69;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Nunito', sans-serif; }
        
        body {
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 3px, transparent 3px);
            background-size: 40px 40px;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 { text-align: center; margin-bottom: 15px; }
        .title-main { 
            font-size: 2.5rem; color: #ff0055; 
            text-shadow: 3px 3px 0px #fff, 6px 6px 0px #ffb3c6; 
            margin: 20px 0; 
            animation: bounce 2s infinite;
        }
        .text-blue { color: #2563eb; }
        .text-green { color: #16a34a; }
        .text-red { color: #dc2626; }

        .screen {
            display: none; width: 100%; max-width: 1000px; padding: 20px;
            flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
            position: relative; z-index: 10;
        }
        .screen.active { display: flex; }
        
        .box-panel {
            background: rgba(255, 255, 255, 0.95); border-radius: 30px; padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 6px solid #facc15;
            width: 100%; max-width: 550px; text-align: center;
            position: relative;
        }
        .box-panel::before {
            content: '✨'; position: absolute; top: -20px; left: -20px; font-size: 3rem;
        }
        .box-panel::after {
            content: '🎈'; position: absolute; bottom: -20px; right: -20px; font-size: 3rem;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { font-weight: 900; display: block; margin-bottom: 8px; color: #64748b; font-size: 1.1rem; }
        .input-field {
            width: 100%; padding: 15px; border: 3px solid #cbd5e1; border-radius: 20px;
            font-size: 1.2rem; outline: none; transition: 0.3s; background: #f8fafc;
        }
        .input-field:focus { border-color: #ffb3c6; box-shadow: 0 0 0 5px rgba(255,179,198,0.4); background: #fff; }

        .btn {
            padding: 15px 20px; font-size: 1.2rem; font-weight: 900; border-radius: 25px;
            border: 3px solid transparent; cursor: pointer; transition: 0.2s;
            display: inline-block; width: 100%; margin-bottom: 10px;
            touch-action: manipulation; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:active { transform: translateY(6px); box-shadow: none !important; }
        
        .btn-blue { background: #dbeafe; color: #1d4ed8; border-color: #60a5fa; box-shadow: 0 6px 0 #60a5fa; }
        .btn-green { background: #dcfce7; color: #15803d; border-color: #4ade80; box-shadow: 0 6px 0 #4ade80; }
        .btn-yellow { background: #fef9c3; color: #a16207; border-color: #facc15; box-shadow: 0 6px 0 #facc15; }
        .btn-primary { background: linear-gradient(135deg, #ff7eb3, #ff758c); color: white; box-shadow: 0 6px 0 #d81b60; border: none; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .header { width: 100%; max-width: 900px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; }
        
        .btn-sound {
            background: #fff; border: 4px solid var(--cute-pink); border-radius: 50%; width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer;
            box-shadow: 0 5px 0 var(--cute-pink); transition: 0.2s; padding: 0;
        }
        .btn-sound:active { transform: translateY(5px); box-shadow: none; }

        .scoreboard { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; flex: 1; }
        .team-score {
            background: #fff; padding: 10px 15px; border-radius: 20px; border: 3px solid #ccc;
            text-align: center; min-width: 100px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .team-score.active { transform: scale(1.15); border-color: #ff0055; box-shadow: 0 0 20px rgba(255,0,85,0.4); z-index: 2; }
        .team-name { font-size: 1rem; font-weight: 900; color: #64748b; }
        .team-pts { font-size: 1.8rem; font-weight: 900; color: #0f172a; }
        
        .turn-indicator {
            background: white; padding: 12px 25px; border-radius: 30px; font-size: 1.3rem; font-weight: 900;
            border: 4px dashed #3b82f6; color: #1d4ed8; display: inline-block; margin-bottom: 25px;
            animation: pulse-border 1.5s infinite; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .bags-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 800px; width: 100%; margin: 0 auto;
        }
        @media (min-width: 600px) { .bags-grid { grid-template-columns: repeat(4, 1fr); gap: 25px; } }
        
        .bag {
            aspect-ratio: 3/4; border-radius: 25px 25px 15px 15px; cursor: pointer;
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 4px solid rgba(255,255,255,0.7); box-shadow: 0 8px 0 rgba(0,0,0,0.15); transition: 0.2s;
            touch-action: manipulation;
        }
        .bag:active:not(.disabled) { transform: scale(0.9); box-shadow: 0 2px 0 rgba(0,0,0,0.15); translateY(6px); }
        .bag.disabled { filter: grayscale(0.9); opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
        .bag-number {
            position: absolute; top: 8px; background: rgba(255,255,255,0.6); padding: 4px 12px;
            border-radius: 15px; font-weight: 900; color: #333; font-size: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .bag-icon { font-size: 3.5rem; filter: drop-shadow(3px 5px 3px rgba(0,0,0,0.25)); }
        
        .c-pink { background: linear-gradient(135deg, #ff9a9e, #fecfef); } 
        .c-purple { background: linear-gradient(135deg, #e0c3fc, #8ec5fc); } 
        .c-blue { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
        .c-green { background: linear-gradient(135deg, #84fab0, #8fd3f4); } 
        .c-yellow { background: linear-gradient(135deg, #f6d365, #fda085); } 
        .c-orange { background: linear-gradient(135deg, #fccb90, #d57eeb); }

        @keyframes vibrate {
            0%, 100% { transform: rotate(0deg) translate(0,0); }
            25% { transform: rotate(-12deg) translate(-6px, -2px) scale(1.05); }
            50% { transform: rotate(12deg) translate(6px, 2px) scale(1.05); }
            75% { transform: rotate(-15deg) translate(-6px, -6px) scale(1.1); }
        }
        @keyframes inflate {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.4); filter: brightness(1.3); }
        }
        @keyframes pop {
            0% { transform: scale(1.4); opacity: 1; }
            50% { transform: scale(2.2); opacity: 0.5; filter: blur(3px); }
            100% { transform: scale(0); opacity: 0; display: none; }
        }
        @keyframes pulse-border { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .anim-vibrate { animation: vibrate 0.6s ease-in-out forwards; }
        .anim-inflate { animation: inflate 0.4s ease-in-out forwards; }
        .anim-pop { animation: pop 0.3s ease-out forwards; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75);
            display: none; justify-content: center; align-items: center; z-index: 100; padding: 15px;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active { display: flex; }
        
        .modal-content {
            background: radial-gradient(circle at top left, #ffffff, #fff0f5);
            width: 100%; max-width: 600px; border-radius: 40px; padding: 30px 25px;
            position: relative; border: 8px solid var(--cute-pink);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,179,198,0.3);
            max-height: 90vh; overflow-y: auto;
        }
        
        .timer {
            position: absolute; top: -30px; right: -15px; width: 75px; height: 75px;
            background: #ff0055; color: white; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 900;
            border: 5px solid white; box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            animation: bounce 1s infinite;
        }

        .cute-title {
            background: white; padding: 15px 20px; border-radius: 25px;
            border: 4px dashed var(--cute-pink-dark); color: #d81b60;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px;
            font-size: 1.4rem; font-weight: 900; text-align: center; line-height: 1.4;
        }

        .btn-opt {
            border-radius: 30px; border: 4px solid rgba(255,255,255,0.5); padding: 15px 20px;
            font-size: 1.2rem; margin-bottom: 15px; box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            font-weight: 900; text-align: center; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-opt:active { transform: translateY(8px); box-shadow: 0 0 0 transparent !important; }
        
        .opt-pink { background: var(--cute-pink); color: #900028; box-shadow: 0 8px 0 var(--cute-pink-dark); }
        .opt-blue { background: var(--cute-blue); color: #003049; box-shadow: 0 8px 0 var(--cute-blue-dark); }
        .opt-green { background: var(--cute-green); color: #1b4332; box-shadow: 0 8px 0 var(--cute-green-dark); }
        .opt-yellow { background: var(--cute-yellow); color: #785a00; box-shadow: 0 8px 0 var(--cute-yellow-dark); }

        .sort-container { display: flex; gap: 15px; margin-bottom: 20px; }
        .sort-zone {
            flex: 1; min-height: 140px; border: 4px dashed #94a3b8; border-radius: 25px;
            padding: 15px; background: rgba(255,255,255,0.8); transition: 0.3s;
            display: flex; flex-direction: column; gap: 8px;
        }
        .sort-zone h4 { margin-bottom: 10px; color: #475569; font-size: 1.2rem; background: #fff; padding: 5px; border-radius: 15px; }
        .zone-info { border-color: var(--cute-blue-dark); background: #f0f9ff; }
        .zone-dec { border-color: var(--cute-pink-dark); background: #fff1f2; }
        
        .sort-item {
            background: #fff; border: 3px solid #e2e8f0; padding: 10px 15px; border-radius: 15px;
            cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center;
        }
        .sort-item.selected { background: #fef08a; border-color: #eab308; transform: scale(1.05) rotate(-3deg); box-shadow: 0 8px 15px rgba(234, 179, 8, 0.3); }

        .match-container { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
        .match-col { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .match-btn {
            padding: 12px 15px; border: 3px solid #cbd5e1; border-radius: 20px; background: #fff;
            cursor: pointer; font-size: 1rem; font-weight: bold; text-align: center;
            box-shadow: 0 4px 0 #cbd5e1; transition: 0.2s;
        }
        .match-btn:active { transform: translateY(4px); box-shadow: none; }
        .match-btn.selected { border-color: #ff0055; background: #fff1f2; box-shadow: 0 4px 0 #ff0055; color: #ff0055; transform: scale(1.05); }
        .match-btn.matched { border-color: #22c55e; background: #dcfce7; color: #166534; pointer-events: none; opacity: 0.8; box-shadow: none; transform: translateY(4px); }
        
        #fireworksCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div id="setupScreen" class="screen active">
        <div class="box-panel">
            <h1 class="title-main">🎮 ĐẬP TÚI MÙ 🎒</h1>
            <div style="background: #f8fafc; padding: 10px; border-radius: 15px; margin-bottom: 20px; border: 2px dashed #cbd5e1;">
                <p style="color: #64748b; font-weight: 900; font-size: 1.1rem;">Chủ đề: Máy tính và Em</p>
                <p style="color: #2563eb; font-weight: 900; font-size: 1.2rem;">Bài 1: Thông tin và Quyết định</p>
            </div>

            <div class="input-group">
                <label>👤 Tên chiến binh:</label>
                <input type="text" id="playerName" class="input-field" placeholder="Biệt danh (không nhập tên thật)">
            </div>
            <div class="input-group">
                <label>🏫 Lớp:</label>
                <input type="text" id="playerClass" class="input-field" placeholder="Ví dụ: 3A1...">
            </div>

            <h3 style="margin-top: 15px; color: #475569; font-weight: 900;">Chọn chế độ chơi:</h3>
            <div class="btn-grid">
                <button class="btn btn-blue" onclick="startGame(1)">👤 1 Người</button>
                <button class="btn btn-green" onclick="startGame(2)">👥 2 Đội</button>
                <button class="btn btn-yellow" onclick="startGame(3)">👨‍👩‍👧 3 Đội</button>
                <button class="btn btn-primary" onclick="startGame(4)" style="box-shadow: 0 6px 0 #9f1239;">👨‍👩‍👧‍👦 4 Đội</button>
            </div>
            <p style="margin-top: 20px; font-size: 0.9rem; color: #ef4444; font-weight: bold; background: #fee2e2; padding: 10px; border-radius: 10px;">
                *Chú ý: Bật âm lượng thiết bị để trải nghiệm nhạc nền cực hay! 🎵
            </p>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="header">
            <!-- Nút bật/tắt nhạc nền -->
            <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🎵</button>
            
            <div style="background: #ff0055; color: white; padding: 10px 20px; border-radius: 30px; font-weight: 900; font-size: 1.2rem; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                🎒 ĐẬP TÚI MÙ
            </div>
            
            <div id="playerInfoHeader" style="font-weight: 900; color: #475569; background: white; padding: 8px 20px; border-radius: 20px; border: 3px dashed #ffb3c6; box-shadow: 0 4px 6px rgba(0,0,0,0.05);"></div>
        </div>
        
        <div class="scoreboard" id="scoreboard" style="width: 100%; max-width: 900px; margin-bottom: 20px;"></div>

        <div class="turn-indicator" id="turnIndicator">👉 Đến lượt: Đội 1 👈</div>

        <div class="bags-grid" id="bagsGrid">
            <!-- JS sẽ sinh ra túi ở đây -->
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content" id="modalContent">
            <div class="timer" id="timerDisplay">15</div>
            <div id="modalBody">
                <!-- JS chèn nội dung -->
            </div>
        </div>
    </div>

    <div id="endScreen" class="screen" style="background: rgba(15, 23, 42, 0.9); color: white;">
        <h1 style="font-size: 3.5rem; color: #facc15; text-shadow: 0 0 25px rgba(250,204,21,0.8); margin-bottom: 10px;" class="anim-bounce">🏆 VÔ ĐỊCH 🏆</h1>
        <h2 id="winnerName" style="font-size: 2.2rem; margin-bottom: 10px; color: #fff;"></h2>
        <p id="winnerClass" style="font-size: 1.4rem; color: #94a3b8; margin-bottom: 30px; font-weight: bold;"></p>
        
        <div id="finalScores" style="background: white; color: #1e293b; padding: 25px; border-radius: 30px; min-width: 350px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 5px solid #facc15;">
            <!-- Điểm tổng kết -->
        </div>

        <button class="btn btn-primary" style="padding: 20px 40px; font-size: 1.6rem; max-width: 300px; box-shadow: 0 8px 0 #9f1239; border-radius: 35px;" onclick="location.reload()">🔄 CHƠI LẠI</button>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let bgmNode, bgmGain;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            initBGM();
        }

        // Tạo nhạc nền Hộp nhạc (Music Box)
        function initBGM() {
            if(bgmNode) return;
            const sampleRate = audioCtx.sampleRate;
            const bpm = 120;
            const beatLen = 60 / bpm; // 0.5s
            // Giai điệu siêu dễ thương (Arpeggio)
            const notes = [329.63, 392.00, 523.25, 659.25, 523.25, 392.00, 261.63, 329.63]; 
            const buffer = audioCtx.createBuffer(1, sampleRate * beatLen * notes.length, sampleRate);
            const data = buffer.getChannelData(0);

            for(let i=0; i<notes.length; i++) {
                let freq = notes[i];
                let start = Math.floor(i * beatLen * sampleRate);
                let end = Math.floor((i+1) * beatLen * sampleRate);
                for(let j=start; j<end; j++) {
                    let t = (j - start) / sampleRate;
                    let env = Math.exp(-4 * t); // Tiếng gõ vang
                    // Kết hợp sóng sin và sóng hài để tạo tiếng chuông / music box
                    let wave = Math.sin(2 * Math.PI * freq * t) + 0.4 * Math.sin(2 * Math.PI * freq * 2 * t);
                    data[j] = wave * env * 0.15;
                }
            }

            bgmNode = audioCtx.createBufferSource();
            bgmNode.buffer = buffer;
            bgmNode.loop = true;

            bgmGain = audioCtx.createGain();
            bgmGain.gain.value = 0.2; // Volume nhạc nền

            bgmNode.connect(bgmGain);
            bgmGain.connect(audioCtx.destination);
            bgmNode.start();
        }

        function toggleSound() {
            if(!audioCtx) initAudio();
            isMuted = !isMuted;
            if(bgmGain) {
                bgmGain.gain.value = isMuted ? 0 : 0.2;
            }
            document.getElementById('soundBtn').innerText = isMuted ? '🔇' : '🎵';
        }

        const SoundFX = {
            playTone: (freq, type, duration, vol=1) => {
                if (!audioCtx || isMuted) return;
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            },
            hit: () => { SoundFX.playTone(150, 'square', 0.1, 0.4); },
            pop: () => {
                if(!audioCtx || isMuted) return;
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            },
            correct: () => {
                SoundFX.playTone(523.25, 'sine', 0.1, 0.4); 
                setTimeout(() => SoundFX.playTone(659.25, 'sine', 0.1, 0.4), 100); 
                setTimeout(() => SoundFX.playTone(783.99, 'sine', 0.4, 0.4), 200); 
            },
            wrong: () => {
                SoundFX.playTone(300, 'triangle', 0.2, 0.4);
                setTimeout(() => SoundFX.playTone(250, 'triangle', 0.4, 0.4), 150);
            },
            tick: () => { SoundFX.playTone(1200, 'square', 0.05, 0.05); },
            reward: () => {
                let time = 0;
                [440, 554.37, 659.25, 880, 1108.73].forEach(f => {
                    setTimeout(() => SoundFX.playTone(f, 'sine', 0.15, 0.3), time); time += 80;
                });
            },
            victory: () => {
                if(bgmGain) bgmGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1); // Tắt dần nhạc nền
                let time = 0;
                [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50].forEach(f => {
                    setTimeout(() => SoundFX.playTone(f, 'sine', 0.2, 0.5), time); time += 100;
                });
                setTimeout(() => {
                    if(!audioCtx || isMuted) return;
                    const bufferSize = audioCtx.sampleRate * 2.5;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5; // White noise cho tiếng vỗ tay
                    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                    const gain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass'; filter.frequency.value = 1000;
                    gain.gain.setValueAtTime(0, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.3);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
                    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                    noise.start();
                }, 700);
            }
        };

        const questionsData = [
            { type: 'mcq', text: 'Tiếng chuông báo thức "Reng reng" là thông tin dạng gì?', options: ['📝 Dạng chữ', '🎵 Dạng âm thanh', '🖼️ Dạng hình ảnh'], correct: 1 },
            { type: 'mcq', text: 'Dòng chữ "Trường Tiểu học Kim Đồng" trên cổng trường là thông tin dạng gì?', options: ['📝 Dạng chữ', '🎵 Dạng âm thanh', '🖼️ Dạng hình ảnh'], correct: 0 },
            { type: 'mcq', text: 'Hành động "Thức dậy, rời khỏi giường" của Minh sau khi nghe chuông báo thức được gọi là gì?', options: ['Thông tin', 'Trò chơi', 'Quyết định'], correct: 2 },
            { 
                type: 'sort', 
                text: 'Phân loại các câu sau thành THÔNG TIN và QUYẾT ĐỊNH:',
                items: [
                    { id: 'i1', text: 'Trời đang mưa 🌧️', ans: 'info' },
                    { id: 'i2', text: 'Mặc áo mưa 🧥', ans: 'dec' },
                    { id: 'i3', text: 'Có tiết Thể dục ⚽', ans: 'info' },
                    { id: 'i4', text: 'Đi giày thể thao 👟', ans: 'dec' }
                ]
            },
            {
                type: 'match',
                text: 'Ghép Thông tin với Quyết định tương ứng:',
                pairs: [
                    { info: 'Thấy An vui vẻ 😊', dec: 'Kết bạn với An 🤝' },
                    { info: 'Đèn giao thông đỏ 🔴', dec: 'Dừng xe lại 🛑' },
                    { info: 'Trời rất lạnh ❄️', dec: 'Mặc áo ấm 🧥' }
                ]
            },
            { type: 'mcq', text: 'Mẹ bảo: "Hãy ngủ đi một lát". Nghe lời mẹ, Minh nhắm mắt ngủ. Quyết định của Minh là gì?', options: ['Nghe mẹ nói', 'Mở truyện ra đọc', 'Nhắm mắt đi ngủ'], correct: 2 },
            { type: 'mcq', text: 'Hình vẽ lõi táo trên thùng rác màu xanh lá cây là thông tin dạng gì?', options: ['🖼️ Dạng hình ảnh', '📝 Dạng chữ', '🎵 Dạng âm thanh'], correct: 0 },
            { type: 'mcq', text: 'Bạn báo thư viện có truyện cổ tích mới. Em rủ bạn lên mượn. Đâu là Quyết định?', options: ['Thư viện có truyện', 'Rủ bạn lên mượn truyện', 'Cả 2 đều sai'], correct: 1 }
        ];

        const rewardsData = [
            { type: 'reward', title: 'NGÔI SAO MAY MẮN! ✨', desc: 'Đội của bạn được cộng nóng 10 điểm!', points: 10 },
            { type: 'reward', title: 'TÚI X2 ĐIỂM! 🎁', desc: 'Tuyệt vời! Cộng ngay 20 điểm!', points: 20 },
            { type: 'boss', title: 'GẶP BOSS GẤU! 🐻', desc: 'Boss Gấu tặng bạn 15 điểm dũng cảm!', points: 15 },
            { type: 'reward', title: 'THÊM LƯỢT! 🎲', desc: 'Đội bạn được cộng 5 điểm và chơi thêm 1 lượt!', points: 5, extraTurn: true }
        ];

        let player = { name: '', class: '' };
        let teams = [];
        let currentTeamIdx = 0;
        let bags = [];
        let openedCount = 0;
        let timerInt;
        let timeLeft = 0;
        let isAnimating = false;

        const bgColors = ['c-pink', 'c-purple', 'c-blue', 'c-green', 'c-yellow', 'c-orange'];
        const emojis = ['🛍️', '🎒', '🎁', '👜', '💼', '📦'];

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startGame(numTeams) {
            initAudio(); // Bắt buộc chạy ở đây sau khi user click
            
            player.name = document.getElementById('playerName').value.trim() || 'Tuyển thủ bí ẩn';
            player.class = document.getElementById('playerClass').value.trim() || 'Trường Làng';

            document.getElementById('playerInfoHeader').innerText = `👤 ${player.name} - 🏫 Lớp ${player.class}`;

            teams = [];
            let teamColors = ['#ff0055', '#2563eb', '#16a34a', '#ca8a04'];
            for(let i=0; i<numTeams; i++) {
                teams.push({ id: i, name: `Đội ${i+1}`, score: 0, color: teamColors[i] });
            }

            // Sinh 12 túi ngẫu nhiên
            let allItems = shuffle([...questionsData, ...rewardsData, ...questionsData]).slice(0, 12);
            bags = allItems.map((item, idx) => ({
                id: idx, content: item, isOpen: false,
                colorClass: bgColors[idx % bgColors.length],
                icon: emojis[idx % emojis.length]
            }));

            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            
            renderScoreboard(); renderBags(); updateTurn();
        }

        function renderScoreboard() {
            const sb = document.getElementById('scoreboard');
            sb.innerHTML = '';
            teams.forEach((t, i) => {
                let isActive = (i === currentTeamIdx) ? 'active' : '';
                sb.innerHTML += `
                    <div class="team-score ${isActive}" style="border-bottom: 6px solid ${t.color}">
                        <div class="team-name" style="color: ${t.color}">${t.name}</div>
                        <div class="team-pts">${t.score}</div>
                    </div>
                `;
            });
        }

        function updateTurn() {
            const ind = document.getElementById('turnIndicator');
            ind.innerText = `👉 Lượt của: ${teams[currentTeamIdx].name} 👈`;
            ind.style.borderColor = teams[currentTeamIdx].color;
            ind.style.color = teams[currentTeamIdx].color;
            renderScoreboard();
        }

        function renderBags() {
            const grid = document.getElementById('bagsGrid');
            grid.innerHTML = '';
            bags.forEach((bag, i) => {
                let disabledClass = bag.isOpen ? 'disabled' : '';
                grid.innerHTML += `
                    <div id="bag-${i}" class="bag ${bag.colorClass} ${disabledClass}" onclick="clickBag(${i})">
                        <div class="bag-number">Số ${i+1}</div>
                        <div class="bag-icon">${bag.icon}</div>
                    </div>
                `;
            });
        }

        async function clickBag(i) {
            if (isAnimating || bags[i].isOpen) return;
            isAnimating = true;
            const el = document.getElementById(`bag-${i}`);
            
            SoundFX.hit();
            el.classList.add('anim-vibrate');
            await new Promise(r => setTimeout(r, 600));
            
            el.classList.remove('anim-vibrate'); el.classList.add('anim-inflate');
            SoundFX.playTone(300, 'sine', 0.4, 0.4);
            await new Promise(r => setTimeout(r, 400));

            el.classList.remove('anim-inflate'); el.classList.add('anim-pop');
            SoundFX.pop();
            bags[i].isOpen = true; openedCount++;

            await new Promise(r => setTimeout(r, 300));
            openModal(bags[i].content);
        }

        function openModal(content) {
            const overlay = document.getElementById('modalOverlay');
            const body = document.getElementById('modalBody');
            const timerEl = document.getElementById('timerDisplay');
            overlay.classList.add('active');

            if(content.type === 'reward' || content.type === 'boss') {
                timerEl.style.display = 'none'; SoundFX.reward();
                body.innerHTML = `
                    <h2 style="font-size:2.5rem; margin-top:10px; color:#ff0055; text-shadow: 2px 2px #ffb3c6;">${content.title}</h2>
                    <p style="font-size:1.4rem; font-weight:900; margin: 25px 0; color:#4a4e69;">${content.desc}</p>
                    <button class="btn btn-primary" style="font-size: 1.5rem; padding: 20px;" onclick="handleReward(${content.points}, ${content.extraTurn})">NHẬN THƯỞNG LUÔN!</button>
                `;
            } else {
                timerEl.style.display = 'flex'; timerEl.style.background = '#ff0055';
                renderQuestion(content, body); startTimer();
            }
        }

        function renderQuestion(q, container) {
            let html = `<div class="cute-title">${q.text}</div>`;
            const btnColors = ['opt-pink', 'opt-blue', 'opt-green', 'opt-yellow'];
            
            if (q.type === 'mcq') {
                q.options.forEach((opt, idx) => {
                    let cClass = btnColors[idx % btnColors.length];
                    html += `<div class="btn-opt ${cClass}" onclick="checkMCQ(${idx}, ${q.correct})">${opt}</div>`;
                });
                container.innerHTML = html;
            } 
            else if (q.type === 'sort') {
                window.currentSortData = JSON.parse(JSON.stringify(q.items)); window.selectedSortItem = null;
                html += `
                    <div style="font-size:1rem; color:#64748b; margin-bottom:15px; font-weight:bold; text-align:center;">👆 Chạm vào thẻ, sau đó chạm vào ô muốn xếp.</div>
                    <div id="sortPool" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; justify-content:center; min-height:50px;">
                        ${q.items.map(i => `<div class="sort-item" id="item-${i.id}" onclick="selectSortItem('${i.id}')">${i.text}</div>`).join('')}
                    </div>
                    <div class="sort-container">
                        <div class="sort-zone zone-info" id="zone-info" onclick="placeSortItem('info')">
                            <h4>📝 THÔNG TIN</h4>
                        </div>
                        <div class="sort-zone zone-dec" id="zone-dec" onclick="placeSortItem('dec')">
                            <h4>✅ QUYẾT ĐỊNH</h4>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="checkSort()">KIỂM TRA ĐÁP ÁN</button>
                `;
                container.innerHTML = html;
            }
            else if (q.type === 'match') {
                let rightSide = shuffle(q.pairs.map((p, i) => ({ id: i, text: p.dec })));
                window.matchState = { left: null, right: null, matches: 0, total: q.pairs.length, correct: 0 };
                html += `
                    <div style="font-size:1rem; color:#64748b; margin-bottom:15px; font-weight:bold; text-align:center;">🔗 Chọn 1 ô bên trái và 1 ô bên phải để ghép.</div>
                    <div class="match-container">
                        <div class="match-col">
                            ${q.pairs.map((p, i) => `<div class="match-btn left-btn" id="l-${i}" onclick="selectMatch('l', ${i})">${p.info}</div>`).join('')}
                        </div>
                        <div class="match-col">
                            ${rightSide.map(r => `<div class="match-btn right-btn" id="r-${r.id}" onclick="selectMatch('r', ${r.id})">${r.text}</div>`).join('')}
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            }
        }

        function startTimer() {
            timeLeft = 15; const timerEl = document.getElementById('timerDisplay');
            timerEl.innerText = timeLeft; clearInterval(timerInt);
            timerInt = setInterval(() => {
                timeLeft--; timerEl.innerText = timeLeft;
                if(timeLeft <= 5 && timeLeft > 0) { SoundFX.tick(); timerEl.style.background = '#9f1239'; }
                if(timeLeft <= 0) {
                    clearInterval(timerInt); SoundFX.wrong(); showResult(false, 'HẾT GIỜ RỒI! ⏱️');
                }
            }, 1000);
        }

        function checkMCQ(selected, correct) {
            clearInterval(timerInt);
            if(selected === correct) { rewardTeam(10); showResult(true, 'CHÍNH XÁC! 🎉<br><span style="font-size:1.5rem; color:#ec4899">+10 Điểm</span>'); }
            else { SoundFX.wrong(); showResult(false, 'SAI RỒI TIẾC QUÁ! 😢'); }
        }

        function selectSortItem(id) {
            document.querySelectorAll('.sort-item').forEach(el => el.classList.remove('selected'));
            document.getElementById(`item-${id}`).classList.add('selected');
            window.selectedSortItem = id; SoundFX.playTone(800, 'sine', 0.05, 0.2);
        }
        function placeSortItem(zone) {
            if(!window.selectedSortItem) return;
            const itemEl = document.getElementById(`item-${window.selectedSortItem}`);
            document.getElementById(`zone-${zone}`).appendChild(itemEl);
            itemEl.classList.remove('selected'); itemEl.dataset.zone = zone;
            window.selectedSortItem = null; SoundFX.playTone(600, 'square', 0.05, 0.2);
        }
        function checkSort() {
            clearInterval(timerInt);
            let allCorrect = true, placedCount = 0;
            window.currentSortData.forEach(item => {
                const el = document.getElementById(`item-${item.id}`);
                if(el.dataset.zone) placedCount++;
                if(el.dataset.zone !== item.ans) allCorrect = false;
            });
            if(placedCount < window.currentSortData.length) { alert("Chưa phân loại hết các thẻ kìa!"); startTimer(); return; }
            
            if(allCorrect) { rewardTeam(15); showResult(true, 'XUẤT SẮC! 🎉<br><span style="font-size:1.5rem; color:#ec4899">+15 Điểm</span>'); }
            else { SoundFX.wrong(); showResult(false, 'SAI RỒI! Cần chú ý hơn nhé 😢'); }
        }

        function selectMatch(side, id) {
            const prefix = side === 'l' ? 'l' : 'r';
            document.querySelectorAll(`.${side === 'l' ? 'left-btn' : 'right-btn'}`).forEach(el => {
                if(!el.classList.contains('matched')) el.classList.remove('selected');
            });
            const el = document.getElementById(`${prefix}-${id}`);
            if(el.classList.contains('matched')) return;
            
            el.classList.add('selected'); window.matchState[side === 'l' ? 'left' : 'right'] = id;
            SoundFX.playTone(800, 'sine', 0.05, 0.2);

            if(window.matchState.left !== null && window.matchState.right !== null) {
                const lId = window.matchState.left, rId = window.matchState.right;
                if(lId === rId) {
                    document.getElementById(`l-${lId}`).classList.add('matched');
                    document.getElementById(`r-${rId}`).classList.add('matched');
                    window.matchState.correct++; SoundFX.playTone(1000, 'sine', 0.1, 0.3);
                } else {
                    document.getElementById(`l-${lId}`).classList.remove('selected');
                    document.getElementById(`r-${rId}`).classList.remove('selected');
                    SoundFX.playTone(200, 'triangle', 0.1, 0.3);
                }
                window.matchState.left = null; window.matchState.right = null;
                
                if(window.matchState.correct === window.matchState.total) {
                    clearInterval(timerInt); rewardTeam(15); showResult(true, 'GHÉP ĐÚNG HẾT! 🎉<br><span style="font-size:1.5rem; color:#ec4899">+15 Điểm</span>');
                }
            }
        }

        function handleReward(pts, extraTurn) { 
            rewardTeam(pts); 
            closeModal(extraTurn); 
        }
        
        function rewardTeam(pts) { SoundFX.correct(); teams[currentTeamIdx].score += pts; renderScoreboard(); }

        function showResult(isCorrect, msg) {
            const body = document.getElementById('modalBody');
            const color = isCorrect ? '#16a34a' : '#dc2626';
            body.innerHTML = `
                <h2 style="font-size:2.5rem; margin-top:20px; color:${color}; font-weight:900;">${msg}</h2>
                <button class="btn btn-primary" style="margin-top:20px; padding: 15px;" onclick="closeModal()">TIẾP TỤC ➡️</button>
            `;
        }

        function closeModal(extraTurn = false) {
            clearInterval(timerInt);
            document.getElementById('modalOverlay').classList.remove('active');
            renderBags(); 
            
            if(!extraTurn) currentTeamIdx = (currentTeamIdx + 1) % teams.length;
            updateTurn(); isAnimating = false;

            if (openedCount >= bags.length) setTimeout(endGame, 1000);
        }

        function endGame() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('endScreen').classList.add('active');
            
            SoundFX.victory(); startFireworks();

            const sorted = [...teams].sort((a,b) => b.score - a.score);
            const winner = sorted[0];
            
            document.getElementById('winnerName').innerText = `🏆 ${player.name} (${winner.name}) 🏆`;
            document.getElementById('winnerClass').innerText = `Lớp: ${player.class}`;
            
            let scoreHtml = '';
            sorted.forEach((t, i) => {
                let medal = i===0 ? '🥇' : i===1 ? '🥈' : '🥉';
                scoreHtml += `<div style="display:flex; justify-content:space-between; font-size:1.5rem; margin-bottom:15px; font-weight:900; border-bottom:2px dashed #cbd5e1; padding-bottom:10px;">
                    <span style="color:${t.color}">${medal} ${t.name}</span> <span style="color:#e11d48">${t.score} đ</span>
                </div>`;
            });
            document.getElementById('finalScores').innerHTML = scoreHtml;
        }

        const cvs = document.getElementById('fireworksCanvas'); const ctx = cvs.getContext('2d');
        let particles = []; let animId;

        function resize() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function createExplosion(x, y) {
            for(let i=0; i<60; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15 - 2,
                    r: Math.random()*5+2,
                    color: `hsl(${Math.random()*360}, 100%, 60%)`,
                    alpha: 1, decay: Math.random()*0.015 + 0.01
                });
            }
        }

        function loopFireworks() {
            ctx.clearRect(0,0,cvs.width,cvs.height);
            if(Math.random() < 0.08) createExplosion(Math.random()*cvs.width, Math.random()*(cvs.height/2));
            
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.alpha -= p.decay;
                if(p.alpha <= 0) { particles.splice(i,1); continue; }
                ctx.globalAlpha = p.alpha; ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fillStyle = p.color; ctx.fill();
            }
            animId = requestAnimationFrame(loopFireworks);
        }

        function startFireworks() { resize(); loopFireworks(); }
    </script>
</body>
</html>
