<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CẦN CẨU KIẾN THỨC - LỚP 3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Quicksand:wght@600;700;900&display=swap');

        :root {
            --primary: #FF5722; --secondary: #00BCD4; --success: #4CAF50; --danger: #FF3D00;
            --bg-sky: #4FC3F7; --bg-ground: #8D6E63; --text-light: #fff; --text-dark: #2c3e50;
            --font-main: 'Quicksand', system-ui, sans-serif;
            --font-title: 'Nunito', system-ui, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: var(--font-main); overflow: hidden; background-color: #29b6f6;
            display: flex; justify-content: center; align-items: center;
        }

        #app {
            width: 100%; height: 100%; max-width: 1200px; max-height: 800px;
            position: relative; 
            background: linear-gradient(to bottom, #4fc3f7 0%, #b3e5fc 55%, #8d6e63 55%, #5d4037 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow: hidden;
            border-radius: 0px;
        }
        @media (min-width: 1200px) { #app { border-radius: 20px; border: 8px solid #fff; } }

        /* Screens */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.95); z-index: 100; transition: opacity 0.3s;
            padding: 20px; text-align: center;
        }
        #game-screen { background: transparent; }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        h1, h2, h3 { font-family: var(--font-title); color: var(--primary); 
            text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 6px 15px rgba(0,0,0,0.2); 
            line-height: 1.2;
        }
        h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); margin-bottom: 20px; letter-spacing: 2px; }
        h2 { font-size: clamp(1.5rem, 4vw, 2.5rem); color: var(--secondary); }
        
        /* Inputs & Buttons */
        .input-group { margin-bottom: 20px; width: 100%; max-width: 450px; }
        input {
            width: 100%; padding: 18px; border: 6px solid #b3e5fc; border-radius: 25px;
            font-size: 1.5rem; font-family: var(--font-main); font-weight: 900; text-align: center;
            outline: none; transition: all 0.3s; color: var(--text-dark);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
        }
        input:focus { transform: scale(1.05); border-color: var(--secondary); box-shadow: 0 0 15px rgba(0,188,212,0.5); }

        .btn {
            padding: 15px 40px; font-size: 1.8rem; font-family: var(--font-title); font-weight: 900;
            color: white; border: 4px solid rgba(255,255,255,0.5); border-radius: 30px; cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2), 0 15px 20px rgba(0,0,0,0.2); 
            transition: all 0.1s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:active { transform: translateY(8px); box-shadow: 0 0 0 rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.2); }
        .btn-start { background: linear-gradient(to bottom, #FFCA28, #FF9800); text-shadow: 2px 2px 0 #E65100; border-color: #FFF8E1;}
        .btn-action { background: linear-gradient(to bottom, #4DD0E1, #00BCD4); margin: 5px; font-size: 1.4rem; padding: 12px 30px; text-shadow: 2px 2px 0 #00838F;}
        
        /* HUD & Controls */
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px; display: flex;
            justify-content: space-between; z-index: 10; font-size: 1.3rem; font-weight: 900;
            color: var(--text-dark); background: rgba(255,255,255,0.9); padding: 12px 25px; border-radius: 30px;
            border: 4px solid #fff; box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        .hud-stat { display: flex; gap: 10px; align-items: center; background: #f0f8ff; padding: 5px 15px; border-radius: 20px; border: 2px solid #e1f5fe;}
        .combo-text { color: white; background: var(--danger); border-color: #fff; font-size: 1.5rem; animation: pulse 0.5s infinite alternate; display: none; text-shadow: 1px 1px 0 #000;}
        .boss-timer { color: white; background: #9C27B0; border-color: #fff; font-size: 1.5rem; display: none; text-shadow: 1px 1px 0 #000; animation: shake 1s infinite;}

        #controls {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 20;
        }
        .ctrl-btn {
            width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(to bottom, #FF7043, #F4511E);
            border: 5px solid white; box-shadow: 0 8px 0 #D84315; color: white;
            font-size: 2.5rem; display: flex; justify-content: center; align-items: center;
            cursor: pointer; user-select: none; touch-action: manipulation;
        }
        .ctrl-btn:active { transform: translateY(8px); box-shadow: 0 0 0 #D84315; }
        .ctrl-btn.action { width: 140px; border-radius: 40px; font-family: var(--font-title); font-size: 1.6rem; font-weight: 900; background: linear-gradient(to bottom, #66BB6A, #43A047); box-shadow: 0 8px 0 #2E7D32;}

        /* Audio Toggles */
        #audio-controls { position: absolute; bottom: 15px; right: 15px; z-index: 50; display: flex; gap: 10px; }
        .audio-btn { background: #fff; border: 3px solid #ECEFF1; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; font-size: 1.5rem; box-shadow: 0 4px 0 #CFD8DC; transition: transform 0.1s;}
        .audio-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #CFD8DC;}

        /* Game World */
        #game-area { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Crane */
        #crane-track { position: absolute; top: 12%; left: 0; width: 100%; height: 15px; background: #455A64; border-bottom: 4px solid #263238; border-top: 2px solid #78909C; z-index: 5; }
        #crane-cart {
            position: absolute; top: 12%; left: 50%; transform: translateX(-50%); width: 100px; height: 50px;
            background: repeating-linear-gradient(45deg, #FFC107, #FFC107 10px, #FFA000 10px, #FFA000 20px); 
            border: 4px solid #3E2723; border-radius: 15px 15px 5px 5px; z-index: 6;
            transition: left 0.1s linear; display: flex; justify-content: center;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        #crane-cart::after { content:''; position:absolute; top:5px; width:40px; height:20px; background:rgba(255,255,255,0.3); border-radius:10px; }
        #crane-wire {
            position: absolute; top: 50px; left: 46px; width: 6px; height: 20px;
            background: repeating-linear-gradient(to bottom, #9E9E9E, #9E9E9E 4px, #616161 4px, #616161 8px); 
            transform-origin: top; z-index: 5;
        }
        #crane-hook {
            position: absolute; bottom: -25px; left: -20px; width: 46px; height: 35px;
            border: 6px solid #424242; border-top: none; border-radius: 0 0 25px 25px; z-index: 6;
            display: flex; justify-content: center; align-items: flex-end;
            box-shadow: 0 5px 5px rgba(0,0,0,0.3);
        }
        
        /* Bins & Crates */
        #bins-container {
            position: absolute; bottom: 22%; left: 0; width: 100%; display: flex;
            justify-content: space-around; padding: 0 2%; z-index: 2; gap: 15px;
        }
        .bin {
            width: 160px; height: 110px; background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            border: 6px solid #1B5E20; border-radius: 20px 20px 5px 5px; color: white;
            display: flex; justify-content: center; align-items: center; text-align: center;
            font-weight: 900; padding: 15px; box-shadow: inset 0 -25px 25px rgba(0,0,0,0.3), 0 10px 15px rgba(0,0,0,0.4);
            position: relative; transition: transform 0.2s; font-size: 1.1rem; text-shadow: 1px 1px 2px #000;
        }
        .bin::before {
            content: ''; position: absolute; top: -12px; left: -6px; right: -6px; height: 16px;
            background: #81C784; border: 4px solid #1B5E20; border-radius: 10px;
        }
        .bin.highlight { transform: scale(1.15) translateY(-10px); box-shadow: 0 0 30px #76FF03; border-color: #76FF03; }

        #crates-container {
            position: absolute; top: 35%; left: 0; width: 100%; height: 150px;
            display: flex; justify-content: center; align-items: flex-start; gap: 20px; z-index: 4; flex-wrap: wrap; pointer-events: none;
        }
        .crate {
            width: 120px; height: 100px; 
            background: #FFB74D; border: 5px solid #E65100;
            border-radius: 12px; display: flex; justify-content: center; align-items: center; text-align: center;
            font-weight: 900; font-size: 1rem; padding: 8px; box-shadow: 4px 6px 0 #E65100;
            color: #3E2723; position: absolute; transition: transform 0.2s;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0,0,0,0.05) 20px, rgba(0,0,0,0.05) 22px);
        }
        .crate::before, .crate::after {
            content: ''; position: absolute; border: 2px solid #E65100; width: 90%; height: 90%; top: 5%; left: 5%; opacity: 0.2; pointer-events: none;
        }
        .crate::before { transform: rotate(20deg); } .crate::after { transform: rotate(-20deg); }
        .crate.grabbed { box-shadow: 0 20px 30px rgba(0,0,0,0.6); transform: scale(1.1); z-index: 10; }

        /* Stage info & Messages */
        #stage-banner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98); padding: 40px 60px; border-radius: 30px;
            border: 8px solid var(--secondary); text-align: center; z-index: 30;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4), inset 0 0 20px #E0F7FA; transition: opacity 0.3s;
        }
        .popup-msg {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; font-family: var(--font-title); font-weight: 900;
            color: var(--success); text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 0 0 20px white, 0 10px 10px rgba(0,0,0,0.2);
            z-index: 40; pointer-events: none; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* Animations */
        @keyframes pulse { 0% {transform: scale(1);} 100% {transform: scale(1.1);} }
        @keyframes shake { 0%, 100% {transform: rotate(0deg);} 25% {transform: rotate(-5deg);} 75% {transform: rotate(5deg);} }
        @keyframes popIn { from {opacity:0; transform: scale(0.5) translate(-50%, -50%);} to {opacity:1; transform: scale(1) translate(-50%, -50%);} }
        
        .floating-score {
            position: absolute; color: #FFEB3B; font-size: 3rem; font-weight: 900; font-family: var(--font-title);
            text-shadow: 2px 2px 0 #F57F17, -1px -1px 0 #F57F17, 0 5px 10px rgba(0,0,0,0.4); pointer-events: none; z-index: 50;
            animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp { 0% {opacity:1; transform: translateY(0) scale(0.5);} 20% {transform: translateY(-20px) scale(1.2);} 100% {opacity:0; transform: translateY(-100px) scale(1);} }

        #review-list { text-align: left; background: #fff3e0; padding: 20px; border-radius: 15px; max-height: 250px; overflow-y: auto; font-size: 1.2rem; border: 4px dashed #FFB74D; margin: 20px 0; box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);}
        #review-list li { margin-bottom: 12px; color: #D84315; font-weight: bold; line-height: 1.4; padding-left: 10px; border-left: 5px solid #FF9800;}
        
        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; margin-bottom: 10px;}
            h2 { font-size: 1.2rem; }
            input { padding: 12px; font-size: 1.2rem; }
            .btn { padding: 12px 25px; font-size: 1.4rem; }
            .bin { width: 100px; height: 90px; font-size: 0.8rem; padding: 5px; border-width: 4px;}
            .crate { width: 90px; height: 75px; font-size: 0.85rem; border-width: 4px; box-shadow: 2px 4px 0 #E65100;}
            #bins-container { bottom: 25%; gap: 5px;}
            .ctrl-btn { width: 60px; height: 60px; font-size: 1.8rem; border-width: 3px; box-shadow: 0 5px 0 #D84315;}
            .ctrl-btn.action { width: 110px; font-size: 1.2rem; }
            #hud { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; font-size: 1rem; padding: 8px; border-radius: 15px;}
            .hud-stat { padding: 4px 10px; }
            #stage-banner { padding: 20px 30px; width: 90%; }
            .popup-msg { font-size: 2rem; width: 100%; text-align: center; }
            #crane-cart { width: 70px; height: 35px; }
            #crane-wire { left: 32px; }
            #crane-hook { width: 34px; height: 25px; left: -14px; bottom: -18px;}
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Audio Controls -->
        <div id="audio-controls">
            <button class="audio-btn" id="btn-music" onclick="Engine.toggleMusic()">🎵</button>
            <button class="audio-btn" id="btn-sound" onclick="Engine.toggleSound()">🔊</button>
        </div>

        <!-- Màn hình Đăng nhập -->
        <div id="login-screen" class="screen">
            <h1>CẦN CẨU KIẾN THỨC</h1>
            <h2>BÀI 5: SỬ DỤNG BÀN PHÍM (LỚP 3)</h2>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="Biệt danh (không nhập tên thật)" autocomplete="off" maxlength="30">
            </div>
            <div class="input-group">
                <input type="text" id="player-class" placeholder="Nhập Lớp (VD: 3A)" autocomplete="off" maxlength="10">
            </div>
            <button class="btn btn-start" onclick="Game.startLogin()">BẮT ĐẦU CHƠI</button>
        </div>

        <!-- Màn hình Gameplay -->
        <div id="game-screen" class="screen hidden" style="background: transparent;">
            <!-- HUD -->
            <div id="hud">
                <div class="hud-stat">👤 <span id="hud-name">Player</span></div>
                <div class="hud-stat">⭐ Điểm: <span id="hud-score">0</span></div>
                <div class="hud-stat combo-text" id="hud-combo">🔥 COMBO x1</div>
                <div class="hud-stat boss-timer" id="hud-timer">⏳ 60s</div>
            </div>

            <!-- Game World -->
            <div id="game-area">
                <div id="crane-track"></div>
                <div id="crane-cart">
                    <div id="crane-wire">
                        <div id="crane-hook"></div>
                    </div>
                </div>
                <div id="crates-container"></div>
                <div id="bins-container"></div>
            </div>

            <!-- Controls -->
            <div id="controls">
                <button class="ctrl-btn" onmousedown="Game.moveCrane(-1)" onmouseup="Game.stopCrane()" ontouchstart="Game.moveCrane(-1)" ontouchend="Game.stopCrane()">◀</button>
                <button class="ctrl-btn action" onclick="Game.actionHook()" id="btn-action">GẮP</button>
                <button class="ctrl-btn" onmousedown="Game.moveCrane(1)" onmouseup="Game.stopCrane()" ontouchstart="Game.moveCrane(1)" ontouchend="Game.stopCrane()">▶</button>
            </div>

            <!-- Overlays -->
            <div id="stage-banner" class="hidden">
                <h2 id="stage-title">CHẶNG 1: GẮP ĐÚNG</h2>
                <p id="stage-desc" style="font-size: 1.2rem; margin-bottom: 20px;">Mô tả nhiệm vụ</p>
                <button class="btn btn-action" onclick="Game.beginStage()">SẴN SÀNG!</button>
            </div>
            <div id="popup-msg" class="popup-msg">XẾP HÀNG THÀNH CÔNG!</div>
        </div>

        <!-- Màn hình Kết quả -->
        <div id="result-screen" class="screen hidden">
            <h1>TỔNG KẾT KHO HÀNG</h1>
            <h2 id="res-player" style="color: var(--text-dark); margin-bottom: 10px;">Học sinh: ...</h2>
            <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px;">
                <div class="hud-stat">⭐ Tổng điểm: <span id="res-score" style="color:var(--primary); font-size:1.5rem">0</span></div>
                <div class="hud-stat">🔥 Combo cao nhất: <span id="res-combo" style="color:var(--danger)">0</span></div>
                <div class="hud-stat">✅ Gắp đúng: <span id="res-correct" style="color:var(--success)">0</span></div>
                <div class="hud-stat">❌ Gắp sai: <span id="res-wrong" style="color:var(--danger)">0</span></div>
            </div>
            
            <h3 style="color: var(--danger); margin-bottom: 5px; text-transform: uppercase;">📚 Kiến thức cần ôn lại:</h3>
            <ul id="review-list"></ul>
            
            <div style="display: flex; gap: 20px; margin-top: 20px;">
                <button class="btn btn-action" onclick="Game.resetGame()">🔄 CHƠI LẠI</button>
                <button class="btn btn-action" style="background:var(--danger)" onclick="Game.goHome()">🏠 TRANG CHỦ</button>
            </div>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE (Web Audio API - 100% Offline, LOUD VOLUME) ---
        const Engine = {
            ctx: null, musicEnabled: true, soundEnabled: true, currentBGM: null, nextNoteTime: 0, currentStep: 0, isPlayingBGM: false,
            
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            
            toggleMusic: function() {
                this.musicEnabled = !this.musicEnabled;
                document.getElementById('btn-music').innerText = this.musicEnabled ? '🎵' : '🔇';
                if (!this.musicEnabled) this.stopBGM();
                else if (Game.state.screen === 'game') this.playBGM(Game.state.stage === 4 ? 'boss' : 'play');
            },
            
            toggleSound: function() {
                this.soundEnabled = !this.soundEnabled;
                document.getElementById('btn-sound').innerText = this.soundEnabled ? '🔊' : '🔇';
            },

            // Synthesize sound effects (Cường độ âm thanh đã được tăng lên đáng kể)
            playSFX: function(type) {
                if (!this.soundEnabled || !this.ctx) return;
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);

                switch(type) {
                    case 'click':
                        osc.type = 'sine'; osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
                        gain.gain.setValueAtTime(1.0, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                        osc.start(t); osc.stop(t + 0.1); break;
                    case 'crane_move':
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(100, t);
                        gain.gain.setValueAtTime(0.5, t); gain.gain.linearRampToValueAtTime(0, t + 0.2);
                        osc.start(t); osc.stop(t + 0.2); break;
                    case 'drop':
                        osc.type = 'square'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.3);
                        gain.gain.setValueAtTime(0.8, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                        osc.start(t); osc.stop(t + 0.3); break;
                    case 'grab':
                        osc.type = 'sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.setValueAtTime(600, t+0.1);
                        gain.gain.setValueAtTime(1.0, t); gain.gain.linearRampToValueAtTime(0, t + 0.2);
                        osc.start(t); osc.stop(t + 0.2); break;
                    case 'correct':
                        osc.type = 'sine'; 
                        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => { // C5, E5, G5, C6
                            osc.frequency.setValueAtTime(freq, t + i*0.1);
                        });
                        gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(1.5, t + 0.05); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
                        osc.start(t); osc.stop(t + 0.4); break;
                    case 'wrong':
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(80, t + 0.4);
                        gain.gain.setValueAtTime(1.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
                        osc.start(t); osc.stop(t + 0.4); break;
                    case 'boss_alert':
                        osc.type = 'square'; osc.frequency.setValueAtTime(800, t); osc.frequency.setValueAtTime(400, t+0.2); osc.frequency.setValueAtTime(800, t+0.4);
                        gain.gain.setValueAtTime(1.0, t); gain.gain.linearRampToValueAtTime(0, t + 0.6);
                        osc.start(t); osc.stop(t + 0.6); break;
                    case 'win':
                        osc.type = 'triangle';
                        [440, 554.37, 659.25, 880].forEach((f, i) => { osc.frequency.setValueAtTime(f, t + i*0.15); }); // A4, C#5, E5, A5
                        gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(1.5, t + 0.1); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
                        osc.start(t); osc.stop(t + 0.8); break;
                }
            },

            // Simple sequencer for BGM
            bgmMaps: {
                play: [ {f: 261.6, d: 0.2}, {f: 0, d: 0.2}, {f: 329.6, d: 0.2}, {f: 392, d: 0.2}, {f: 261.6, d: 0.4}, {f: 0, d: 0.4} ], // Cheerful loop
                boss: [ {f: 200, d: 0.15}, {f: 220, d: 0.15}, {f: 240, d: 0.15}, {f: 200, d: 0.15}, {f: 300, d: 0.3}, {f: 0, d: 0.1} ] // Intense loop
            },
            
            playBGM: function(track) {
                this.stopBGM();
                if (!this.musicEnabled || !this.ctx) return;
                this.isPlayingBGM = true;
                this.currentBGM = track;
                this.currentStep = 0;
                this.nextNoteTime = this.ctx.currentTime + 0.1;
                this.scheduler();
            },
            
            stopBGM: function() {
                this.isPlayingBGM = false;
                clearTimeout(this.timerID);
            },
            
            scheduler: function() {
                if (!this.isPlayingBGM) return;
                while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
                    this.scheduleNote(this.currentStep, this.nextNoteTime);
                    this.nextNote();
                }
                this.timerID = setTimeout(() => this.scheduler(), 25);
            },
            
            nextNote: function() {
                const seq = this.bgmMaps[this.currentBGM];
                this.nextNoteTime += seq[this.currentStep].d;
                this.currentStep = (this.currentStep + 1) % seq.length;
            },
            
            scheduleNote: function(step, time) {
                const seq = this.bgmMaps[this.currentBGM];
                if (seq[step].f === 0) return; // Rest
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = seq[step].f;
                osc.connect(gain); gain.connect(this.ctx.destination);
                gain.gain.setValueAtTime(0.25, time); // Âm lượng nhạc nền được nâng lên
                gain.gain.exponentialRampToValueAtTime(0.001, time + seq[step].d - 0.02);
                osc.start(time); osc.stop(time + seq[step].d);
            }
        };

        // Dữ liệu bám sát Sách giáo khoa Lớp 3 - Bài 5: Sử dụng bàn phím

                bins: [

                ],
                crates: [

                    { id: "c2", label: "Phím J", target: "cogo", type: "correct", review: "Phím J là phím có gờ trên hàng phím cơ sở." },

                bins: [

                    { id: "c2", label: "Ngón trỏ phải", target: "ngontrophai", type: "correct", review: "Ngón trỏ phải đặt lên phím có gờ J." },
                    { id: "c3", label: "Hai ngón cái", target: "ngoncai", type: "correct", review: "Hai ngón cái đặt vào phím dấu cách." }
                ],
                reqScore: 3
            },
            {
                title: "CHẶNG 4: COMBO TỐC ĐỘ (Phần mềm Kiran)",
                desc: "Nhanh tay ghép các từ tiếng Anh trong phần mềm Kiran's Typing Tutor với nghĩa tiếng Việt. Ghép liên tiếp để x2, x3 điểm!",
                bins: [
                    { id: "b_acc", label: "Độ chính xác", accept: "acc" },
                    { id: "b_time", label: "Thời gian luyện tập", accept: "time" },
                    { id: "b_wpm", label: "Số từ gõ trong 1 phút", accept: "wpm" }
                ],
                crates: [
                    { id: "c1", label: "Accuracy", target: "acc", type: "correct", review: "Accuracy nghĩa là Độ chính xác." },
                    { id: "c2", label: "Time Taken", target: "time", type: "correct", review: "Time Taken nghĩa là Thời gian luyện tập." },
                    { id: "c3", label: "Word per Minute", target: "wpm", type: "correct", review: "Word per Minute là Số từ gõ trong một phút." }
                ],
                reqScore: 3
            },
            {
                title: "BOSS: KHO HÀNG HỖN LOẠN",
                desc: "Thời gian có hạn! Phân loại toàn bộ các câu nhận định dưới đây vào kho ĐÚNG hoặc SAI. Dọn sạch bãi hàng trước khi hết giờ!",
                isBoss: true,
                bins: [
                    { id: "b_true", label: "ĐÚNG", accept: "true" },
                    { id: "b_false", label: "SAI", accept: "false" }
                ],
                crates: [
                    { id: "c1", label: "F và J thuộc hàng phím cơ sở", target: "true", type: "correct", review: "F và J là 2 phím có gờ thuộc hàng phím cơ sở." },
                    { id: "c2", label: "F và J thuộc hàng phím trên", target: "false", type: "correct", review: "F và J thuộc hàng phím cơ sở, không phải hàng phím trên." },
                    { id: "c3", label: "Gõ xong đưa tay về hàng phím số", target: "false", type: "correct", review: "Khi gõ xong, phải đưa ngón tay về vị trí xuất phát trên hàng phím cơ sở." },
                    { id: "c4", label: "Khu vực chính có nhiều phím nhất", target: "true", type: "correct", review: "Khu vực chính của bàn phím là khu vực có nhiều phím nhất." },
                    { id: "c5", label: "Ngón cái gõ phím dấu cách", target: "true", type: "correct", review: "Hai ngón cái luôn phụ trách phím dấu cách." }
                ],
                reqScore: 5
            }
        ];

        const Game = {
            state: {
                screen: 'login', player: { name: '', class: '' },
                score: 0, combo: 0, maxCombo: 0, correct: 0, wrong: 0, reviewNotes: new Set(),
                stage: 0, cratesLeft: 0, isPlaying: false, bossTimer: 0, bossInterval: null
            },
            
            crane: {
                x: 50, hookY: 0, speed: 0.8, isMovingLeft: false, isMovingRight: false,
                isActioning: false, attachedCrate: null, loopId: null, mode: 'idle' // idle, dropping, rising
            },

            els: {},

            init: function() {
                this.els = {
                    cart: document.getElementById('crane-cart'),
                    wire: document.getElementById('crane-wire'),
                    hook: document.getElementById('crane-hook'),
                    cratesBox: document.getElementById('crates-container'),
                    binsBox: document.getElementById('bins-container'),
                    btnAction: document.getElementById('btn-action'),
                    msg: document.getElementById('popup-msg')
                };
                
                // Keyboard support
                window.addEventListener('keydown', (e) => {
                    if (this.state.screen !== 'game' || !this.state.isPlaying) return;
                    if (e.key === 'ArrowLeft') this.moveCrane(-1);
                    if (e.key === 'ArrowRight') this.moveCrane(1);
                    if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); this.actionHook(); }
                });
                window.addEventListener('keyup', (e) => {
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') this.stopCrane();
                });
            },

            startLogin: function() {
                Engine.init(); Engine.playSFX('click');
                const name = document.getElementById('player-name').value.trim();
                const cls = document.getElementById('player-class').value.trim();
                
                if (name === '' || cls === '') {
                    alert('Vui lòng nhập đủ Họ Tên và Lớp để bắt đầu!'); return;
                }
                
                this.state.player.name = name;
                this.state.player.class = cls;
                document.getElementById('hud-name').innerText = `${name} - ${cls}`;
                document.getElementById('res-player').innerText = `Học sinh: ${name} (Lớp: ${cls})`;
                
                this.switchScreen('game');
                this.state.stage = 0;
                Engine.playBGM('play');
                this.showStageBanner();
            },

            switchScreen: function(screenId) {
                document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
                document.getElementById(screenId + '-screen').classList.remove('hidden');
                this.state.screen = screenId;
            },

            showStageBanner: function() {
                this.state.isPlaying = false;
                const data = STAGE_DATA[this.state.stage];
                document.getElementById('stage-title').innerText = data.title;
                document.getElementById('stage-desc').innerText = data.desc;
                document.getElementById('stage-banner').classList.remove('hidden');
                if(data.isBoss) Engine.playSFX('boss_alert');
            },

            beginStage: function() {
                Engine.playSFX('click');
                document.getElementById('stage-banner').classList.add('hidden');
                const data = STAGE_DATA[this.state.stage];
                
                // Reset Crane
                this.crane.x = 50; this.updateCranePos();
                this.crane.attachedCrate = null;
                this.els.btnAction.innerText = "GẮP";
                
                // Render Bins
                this.els.binsBox.innerHTML = '';
                data.bins.forEach(b => {
                    let div = document.createElement('div');
                    div.className = 'bin'; div.id = b.id; div.dataset.accept = b.accept;
                    div.innerText = b.label;
                    this.els.binsBox.appendChild(div);
                });

                // Render Crates
                this.els.cratesBox.innerHTML = '';
                // Shuffle crates randomly
                let shuffledCrates = [...data.crates].sort(() => Math.random() - 0.5);
                
                // Position logic to spread them out
                let leftStep = 80 / (shuffledCrates.length); 
                shuffledCrates.forEach((c, i) => {
                    let div = document.createElement('div');
                    div.className = 'crate'; div.id = c.id; 
                    div.dataset.target = c.target; div.dataset.type = c.type; div.dataset.review = c.review;
                    div.innerText = c.label;
                    div.style.left = (10 + i * leftStep) + '%';
                    div.style.top = (Math.random() * 20) + 'px'; // slight vertical variation
                    this.els.cratesBox.appendChild(div);
                });

                this.state.cratesLeft = data.reqScore;
                this.state.isPlaying = true;
                
                if (data.isBoss) {
                    Engine.playBGM('boss');
                    this.state.bossTimer = 60;
                    document.getElementById('hud-timer').style.display = 'block';
                    document.getElementById('hud-timer').innerText = `⏳ ${this.state.bossTimer}s`;
                    this.state.bossInterval = setInterval(() => {
                        this.state.bossTimer--;
                        document.getElementById('hud-timer').innerText = `⏳ ${this.state.bossTimer}s`;
                        if (this.state.bossTimer <= 0) this.bossTimeOut();
                    }, 1000);
                } else {
                    document.getElementById('hud-timer').style.display = 'none';
                }

                if (!this.crane.loopId) this.gameLoop();
            },

            // --- Crane Controls ---
            moveCrane: function(dir) {
                if (!this.state.isPlaying || this.crane.mode !== 'idle') return;
                Engine.playSFX('crane_move');
                if (dir < 0) this.crane.isMovingLeft = true;
                if (dir > 0) this.crane.isMovingRight = true;
            },
            stopCrane: function() { this.crane.isMovingLeft = false; this.crane.isMovingRight = false; },
            
            updateCranePos: function() {
                this.els.cart.style.left = this.crane.x + '%';
                if(this.crane.attachedCrate) {
                    this.crane.attachedCrate.style.left = `calc(${this.crane.x}% - 15px)`; // Center crate under cart
                }
            },

            actionHook: function() {
                if (!this.state.isPlaying || this.crane.mode !== 'idle') return;
                Engine.playSFX('drop');
                this.stopCrane();
                this.crane.mode = 'dropping';
                
                // If carrying, drop to ground (bin check). If empty, drop to crate level.
                const targetY = this.crane.attachedCrate ? 300 : 150; 
                this.animateWire(targetY);
            },

            animateWire: function(targetY) {
                let currentY = 0;
                let step = 10;
                
                const drop = () => {
                    currentY += step;
                    if (this.crane.mode === 'dropping') {
                        this.els.wire.style.height = currentY + 'px';
                        if(this.crane.attachedCrate) this.crane.attachedCrate.style.top = (currentY + 20) + 'px';
                        
                        if (currentY >= targetY) {
                            this.crane.mode = 'rising';
                            if (!this.crane.attachedCrate) this.checkGrab();
                            else this.checkDrop();
                        }
                    } else if (this.crane.mode === 'rising') {
                        currentY -= step * 2; // rise faster
                        this.els.wire.style.height = Math.max(0, currentY) + 'px';
                        if(this.crane.attachedCrate) this.crane.attachedCrate.style.top = (currentY + 20) + 'px';
                        
                        if (currentY <= 0) {
                            this.crane.mode = 'idle';
                            return; // end animation
                        }
                    }
                    requestAnimationFrame(drop);
                };
                drop();
            },

            // --- Collision & Logic ---
            checkGrab: function() {
                const hookRect = this.els.hook.getBoundingClientRect();
                const crates = Array.from(this.els.cratesBox.children).filter(c => !c.classList.contains('grabbed'));
                
                for (let crate of crates) {
                    const rect = crate.getBoundingClientRect();
                    // Simple AABB collision on X axis (hook is dropping down onto it)
                    if (hookRect.left < rect.right && hookRect.right > rect.left) {
                        // Grabbed!
                        Engine.playSFX('grab');
                        this.crane.attachedCrate = crate;
                        crate.classList.add('grabbed');
                        crate.style.top = '20px'; // relative to wire
                        this.els.btnAction.innerText = "THẢ";
                        break;
                    }
                }
                
                if (!this.crane.attachedCrate) {
                    // Missed
                    Engine.playSFX('wrong');
                }
            },

            checkDrop: function() {
                const crate = this.crane.attachedCrate;
                const crateRect = crate.getBoundingClientRect();
                const bins = Array.from(this.els.binsBox.children);
                let droppedInBin = null;

                for (let bin of bins) {
                    const rect = bin.getBoundingClientRect();
                    if (crateRect.left + crateRect.width/2 > rect.left && crateRect.right - crateRect.width/2 < rect.right) {
                        droppedInBin = bin; break;
                    }
                }

                if (droppedInBin) {
                    // Check logic
                    const expectedTarget = droppedInBin.dataset.accept;
                    const crateTarget = crate.dataset.target;
                    
                    if (crateTarget === expectedTarget) {
                        // Correct!
                        this.handleSuccess(crate, droppedInBin);
                    } else {
                        // Wrong Bin!
                        this.handleFail(crate, "SAI KHO!");
                    }
                } else if (crate.dataset.target === "none") {
                    // It's a distractor crate, should drop outside bins to clear it
                    this.handleSuccess(crate, null, "ĐÃ LOẠI BỎ HÀNG NHIỄU!");
                } else {
                    // Dropped outside, return to start
                    this.handleFail(crate, "RƠI RA NGOÀI!");
                }
            },

            handleSuccess: function(crate, bin, customMsg) {
                Engine.playSFX('correct');
                crate.remove(); // clear from DOM
                this.crane.attachedCrate = null;
                this.els.btnAction.innerText = "GẮP";
                
                if (bin) {
                    bin.classList.add('highlight');
                    setTimeout(() => bin.classList.remove('highlight'), 500);
                }

                this.state.correct++;
                this.state.combo++;
                if (this.state.combo > this.state.maxCombo) this.state.maxCombo = this.state.combo;
                
                // Calculate Score (Base 10 * Combo)
                const pts = 10 * (this.state.combo > 3 ? 3 : this.state.combo);
                this.state.score += pts;
                
                this.updateHUD();
                this.showFloatingScore(`+${pts}`, this.crane.x);
                this.showPopup(customMsg || "XẾP HÀNG THÀNH CÔNG!");

                // Check stage complete
                if (crate.dataset.target !== "none") {
                    this.state.cratesLeft--;
                }
                
                if (this.state.cratesLeft <= 0) {
                    this.completeStage();
                }
            },

            handleFail: function(crate, msg) {
                Engine.playSFX('wrong');
                this.showPopup(msg, true);
                
                // Return crate to original state
                crate.classList.remove('grabbed');
                // find a random spot on the belt
                crate.style.top = (Math.random() * 20) + 'px'; 
                this.els.cratesBox.appendChild(crate); 
                
                this.crane.attachedCrate = null;
                this.els.btnAction.innerText = "GẮP";
                
                this.state.wrong++;
                this.state.combo = 0; // break combo
                
                // Save review note
                if (crate.dataset.review) this.state.reviewNotes.add(crate.dataset.review);
                
                this.updateHUD();
            },

            updateHUD: function() {
                document.getElementById('hud-score').innerText = this.state.score;
                const comboEl = document.getElementById('hud-combo');
                if (this.state.combo > 1) {
                    comboEl.style.display = 'flex';
                    comboEl.innerText = `🔥 COMBO x${this.state.combo}`;
                } else {
                    comboEl.style.display = 'none';
                }
            },

            showFloatingScore: function(text, xPercent) {
                const el = document.createElement('div');
                el.className = 'floating-score';
                el.innerText = text;
                el.style.left = xPercent + '%';
                el.style.top = '30%';
                this.els.cart.parentElement.appendChild(el);
                setTimeout(() => el.remove(), 1000);
            },

            showPopup: function(msg, isError = false) {
                this.els.msg.innerText = msg;
                this.els.msg.style.color = isError ? "var(--danger)" : "var(--success)";
                this.els.msg.style.opacity = 1;
                this.els.msg.style.transform = "translate(-50%, -60%) scale(1.1)";
                setTimeout(() => {
                    this.els.msg.style.opacity = 0;
                    this.els.msg.style.transform = "translate(-50%, -50%) scale(1)";
                }, 1500);
            },

            gameLoop: function() {
                if (this.state.isPlaying && this.crane.mode === 'idle') {
                    if (this.crane.isMovingLeft) this.crane.x = Math.max(5, this.crane.x - this.crane.speed);
                    if (this.crane.isMovingRight) this.crane.x = Math.min(95, this.crane.x + this.crane.speed);
                    this.updateCranePos();
                }
                this.crane.loopId = requestAnimationFrame(() => this.gameLoop());
            },

            bossTimeOut: function() {
                this.state.isPlaying = false;
                clearInterval(this.state.bossInterval);
                Engine.playSFX('wrong');
                alert("Hết giờ! Kho hàng vẫn còn lộn xộn. Hãy thử lại!");
                this.beginStage(); // restart boss stage
            },

            completeStage: function() {
                this.state.isPlaying = false;
                if (this.state.bossInterval) clearInterval(this.state.bossInterval);
                
                Engine.playSFX('win');
                
                if (STAGE_DATA[this.state.stage].isBoss) {
                    this.showPopup("KHO KIẾN THỨC ĐÃ ĐƯỢC SẮP XẾP HOÀN HẢO!");
                    setTimeout(() => this.endGame(), 2000);
                } else {
                    this.showPopup("CHẶNG NÀY ĐÃ HOÀN THÀNH!");
                    setTimeout(() => {
                        this.state.stage++;
                        this.showStageBanner();
                    }, 2000);
                }
            },

            endGame: function() {
                Engine.playBGM('play'); // Win bgm
                this.switchScreen('result');
                
                document.getElementById('res-score').innerText = this.state.score;
                document.getElementById('res-combo').innerText = `x${this.state.maxCombo}`;
                document.getElementById('res-correct').innerText = this.state.correct;
                document.getElementById('res-wrong').innerText = this.state.wrong;
                
                const ul = document.getElementById('review-list');
                ul.innerHTML = '';
                if (this.state.reviewNotes.size === 0) {
                    ul.innerHTML = "<li style='color:var(--success)'>Tuyệt vời! Em nắm rất vững kiến thức bài học!</li>";
                } else {
                    this.state.reviewNotes.forEach(note => {
                        let li = document.createElement('li');
                        li.innerText = note;
                        ul.appendChild(li);
                    });
                }
            },

            resetGame: function() {
                this.state.score = 0; this.state.combo = 0; this.state.maxCombo = 0;
                this.state.correct = 0; this.state.wrong = 0; this.state.reviewNotes.clear();
                this.state.stage = 0;
                this.updateHUD();
                this.switchScreen('game');
                this.showStageBanner();
            },
            
            goHome: function() {
                this.state.score = 0; this.state.combo = 0; this.state.maxCombo = 0;
                this.state.correct = 0; this.state.wrong = 0; this.state.reviewNotes.clear();
                Engine.stopBGM();
                document.getElementById('player-name').value = '';
                document.getElementById('player-class').value = '';
                this.switchScreen('login');
            }
        };

        // Khởi tạo Game khi trang tải xong
        window.onload = function() {
            Game.init();
        };
    </script>
