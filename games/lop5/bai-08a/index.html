<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #EC4899;
            --dark: #0F172A;
            --light: #F8FAFC;
            --flash-x: 50%;
            --flash-y: 50%;
            --flash-radius: 150px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            overflow: hidden;
            touch-action: none; /* Prevent scroll on touch */
            user-select: none;
        }

        /* Flashlight effect using CSS Mask */
        .flashlight-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1E293B; /* Slightly lighter dark for background */
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 20px 20px;
            /* The magic flashlight mask */
            -webkit-mask-image: radial-gradient(circle var(--flash-radius) at var(--flash-x) var(--flash-y), black 60%, rgba(0,0,0,0.5) 85%, transparent 100%);
            mask-image: radial-gradient(circle var(--flash-radius) at var(--flash-x) var(--flash-y), black 60%, rgba(0,0,0,0.5) 85%, transparent 100%);
            z-index: 10;
        }

        /* True dark overlay for outside the flashlight */
        .darkness-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 5;
        }

        .card {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: all 0.2s ease-out;
            cursor: crosshair;
        }
        
        .card:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.8);
            border-color: #EC4899;
        }

        .card.locked {
            pointer-events: none;
            animation: pulse-green 1s infinite;
            border-color: #10B981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-10px); }
            100% { transform: translate(-50%, -50%) translateY(0px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes popup {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes float-up {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        .animate-shake { animation: shake 0.5s; }
        .animate-popup { animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 100;
            animation: float-up 1s forwards;
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

        // --- WEB AUDIO API CONTROLLER ---
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.isMusicOn = true;
                this.isSfxOn = true;
                this.bgmOscs = [];
                this.bgmGain = null;
                this.isPlayingBgm = false;
                this.chords = [
                    [261.63, 329.63, 392.00], // C
                    [220.00, 261.63, 329.63], // Am
                    [174.61, 220.00, 261.63], // F
                    [196.00, 246.94, 293.66]  // G
                ];
                this.chordIndex = 0;
                this.bgmInterval = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, vol = 0.1) {
                if (!this.isSfxOn || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playHover() { this.playTone(600, 'sine', 0.1, 0.05); }
            
            playLock() { 
                if(!this.isSfxOn) return;
                this.playTone(440, 'square', 0.1, 0.05);
                setTimeout(() => this.playTone(880, 'square', 0.15, 0.05), 100);
            }

            playCorrect() {
                if(!this.isSfxOn) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.2, 0.1), i * 100);
                });
            }

            playWrong() {
                if(!this.isSfxOn) return;
                this.playTone(150, 'sawtooth', 0.4, 0.1);
                setTimeout(() => this.playTone(130, 'sawtooth', 0.4, 0.1), 150);
            }

            playWin() {
                if(!this.isSfxOn) return;
                [261.63, 329.63, 392.00, 523.25].forEach(f => this.playTone(f, 'sine', 1, 0.2)); // C Maj chord
            }

            startBgm(isBoss = false) {
                if (!this.ctx) this.init();
                if (this.isPlayingBgm) this.stopBgm();
                if (!this.isMusicOn) return;

                this.isPlayingBgm = true;
                this.bgmGain = this.ctx.createGain();
                this.bgmGain.gain.value = 0.03; // Very quiet
                this.bgmGain.connect(this.ctx.destination);

                const speed = isBoss ? 400 : 1000;

                const playChord = () => {
                    if (!this.isPlayingBgm || !this.isMusicOn) return;
                    const chord = this.chords[this.chordIndex];
                    this.bgmOscs = chord.map(freq => {
                        const osc = this.ctx.createOscillator();
                        osc.type = isBoss ? 'triangle' : 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        osc.connect(this.bgmGain);
                        osc.start();
                        osc.stop(this.ctx.currentTime + (speed/1000) - 0.1);
                        return osc;
                    });
                    this.chordIndex = (this.chordIndex + 1) % this.chords.length;
                };

                playChord();
                this.bgmInterval = setInterval(playChord, speed);
            }

            stopBgm() {
                this.isPlayingBgm = false;
                if (this.bgmInterval) clearInterval(this.bgmInterval);
                try {
                    this.bgmOscs.forEach(o => o.stop());
                } catch(e){}
                this.bgmOscs = [];
            }

            toggleMusic() {
                this.isMusicOn = !this.isMusicOn;
                if (this.isMusicOn) {
                    if(this.ctx && this.ctx.state !== 'suspended') this.startBgm(window.gameState.levelIndex === LEVEL_DATA.length - 1);
                } else {
                    this.stopBgm();
                }
                return this.isMusicOn;
            }

            toggleSfx() {
                this.isSfxOn = !this.isSfxOn;
                return this.isSfxOn;
            }
        }

        // --- GAME STATE & LOGIC ---
        const gameState = {
            player: { name: "", class: "" },
            score: 0,
            combo: 1,
            maxCombo: 1,
            correctCount: 0,
            wrongCount: 0,
            reviewNotes: new Set(),
            levelIndex: 0,
            foundTargets: 0,
            sequenceStep: 0,
            timer: 0,
            timerInterval: null,
            isPlaying: false
        };

        const audio = new AudioEngine();

        // DOM Elements
        const screens = {
            intro: document.getElementById('intro-screen'),
            game: document.getElementById('game-area'),
            result: document.getElementById('result-screen'),
            msg: document.getElementById('overlay-msg')
        };
        const hud = {
            container: document.getElementById('hud'),
            name: document.getElementById('hud-name'),
            score: document.getElementById('hud-score'),
            combo: document.getElementById('hud-combo'),
            inst: document.getElementById('hud-instruction'),
            timer: document.getElementById('hud-time'),
            timerContainer: document.getElementById('timer-container')
        };
        const cardsContainer = document.getElementById('cards-container');
        const flashlight = document.getElementById('flashlight-mask');

        // Flashlight Movement
        function updateFlashlight(e) {
            if(!gameState.isPlaying) return;
            let x, y;
            if (e.type.includes('touch')) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            flashlight.style.setProperty('--flash-x', `${x}px`);
            flashlight.style.setProperty('--flash-y', `${y}px`);
        }
        
        document.addEventListener('mousemove', updateFlashlight);
        document.addEventListener('touchmove', updateFlashlight, {passive: false});

        // Initialize Game
        document.getElementById('btn-start').addEventListener('click', () => {
            const name = document.getElementById('player-name').value.trim();
            const cls = document.getElementById('player-class').value.trim();
            if (!name || !cls) {
                const btn = document.getElementById('btn-start');
                btn.classList.add('animate-shake', 'bg-red-500');
                setTimeout(() => btn.classList.remove('animate-shake', 'bg-red-500'), 500);
                return;
            }
            
            audio.init();
            audio.playLock();
            
            gameState.player = { name, class: cls };
            resetGameState();
            
            screens.intro.classList.add('hidden');
            screens.game.classList.remove('hidden');
            hud.container.classList.remove('hidden');
            hud.container.classList.add('flex');
            
            updateHUD();
            startLevel(0);
        });

        // Setup Level
        function startLevel(index) {
            gameState.levelIndex = index;
            gameState.foundTargets = 0;
            gameState.sequenceStep = 0;
            gameState.isPlaying = false;
            cardsContainer.innerHTML = '';
            clearInterval(gameState.timerInterval);

            const level = LEVEL_DATA[index];
            
            // Show transition message
            screens.msg.classList.remove('hidden');
            screens.msg.classList.add('flex');
            document.getElementById('msg-title').innerText = level.name;
            document.getElementById('msg-title').className = `text-5xl md:text-7xl font-black mb-4 text-center text-transparent bg-clip-text animate-popup drop-shadow-[0_0_15px_rgba(255,255,255,0.8)] ${level.isBoss ? 'bg-gradient-to-r from-red-500 to-yellow-500' : 'bg-gradient-to-r from-green-400 to-blue-500'}`;
            document.getElementById('msg-sub').innerText = level.instruction;

            audio.stopBgm();
            if(level.isBoss) audio.playTone(300, 'sawtooth', 1, 0.2); // Boss siren effect

            setTimeout(() => {
                screens.msg.classList.remove('flex');
                screens.msg.classList.add('hidden');
                
                // Configure Flashlight
                flashlight.style.setProperty('--flash-radius', `${level.radius}px`);
                hud.inst.innerText = level.instruction;
                
                spawnCards(level);
                
                gameState.isPlaying = true;
                audio.startBgm(level.isBoss);

                // Setup Timer
                if (level.timeLimit > 0) {
                    gameState.timer = level.timeLimit;
                    hud.timerContainer.classList.remove('hidden');
                    hud.timerContainer.classList.add('flex');
                    hud.timer.innerText = `${gameState.timer}s`;
                    gameState.timerInterval = setInterval(() => {
                        gameState.timer--;
                        hud.timer.innerText = `${gameState.timer}s`;
                        if(gameState.timer <= 10) hud.timer.classList.add('animate-pulse', 'text-red-500');
                        else hud.timer.classList.remove('animate-pulse', 'text-red-500');

                        if (gameState.timer <= 0) {
                            handleTimeOut();
                        }
                    }, 1000);
                } else {
                    hud.timerContainer.classList.remove('flex');
                    hud.timerContainer.classList.add('hidden');
                }

            }, 3000);
        }

        function spawnCards(level) {
            const allCards = [];
            
            level.targets.forEach(t => allCards.push({ ...t, isTarget: true }));
            level.decoys.forEach(d => allCards.push({ ...d, isTarget: false }));
            
            // Shuffle
            allCards.sort(() => Math.random() - 0.5);

            const usedPositions = [];
            const margin = 15; // percentage margin

            allCards.forEach((cardData, idx) => {
                const card = document.createElement('div');
                card.className = 'card bg-slate-800 border-2 border-slate-600 rounded-xl p-4 shadow-lg flex flex-col justify-center items-center text-center';
                card.style.width = '160px';
                card.style.height = '100px';
                
                // Generate non-overlapping random positions (simple percentage grid-like attempt)
                let top, left, overlapping;
                let attempts = 0;
                do {
                    top = margin + Math.random() * (100 - 2 * margin);
                    left = margin + Math.random() * (100 - 2 * margin);
                    overlapping = usedPositions.some(p => Math.abs(p.t - top) < 15 && Math.abs(p.l - left) < 15);
                    attempts++;
                } while (overlapping && attempts < 50);
                
                usedPositions.push({t: top, l: left});
                
                card.style.top = `${top}%`;
                card.style.left = `${left}%`;

                // Content
                card.innerHTML = `
                    <span class="font-bold text-sm md:text-base pointer-events-none">${cardData.text}</span>
                    <button class="mt-2 text-xs bg-pink-600 px-3 py-1 rounded-full font-bold shadow opacity-0 group-hover:opacity-100 transition pointer-events-none">KHÓA</button>
                `;

                // Hover style hack
                card.classList.add('group');
                
                card.addEventListener('mouseenter', () => audio.playHover());

                card.addEventListener('click', (e) => handleCardClick(e, card, cardData, level));

                cardsContainer.appendChild(card);
            });
        }

        function handleCardClick(e, cardEl, cardData, level) {
            if (!gameState.isPlaying || cardEl.classList.contains('locked')) return;

            // Strict checking: Verify distance to flashlight center to prevent clicking dark cards
            const fxStr = flashlight.style.getPropertyValue('--flash-x');
            const fyStr = flashlight.style.getPropertyValue('--flash-y');
            const frStr = flashlight.style.getPropertyValue('--flash-radius');
            if(fxStr && fyStr && frStr) {
                const fx = parseFloat(fxStr);
                const fy = parseFloat(fyStr);
                const fr = parseFloat(frStr);
                const rect = cardEl.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.sqrt(Math.pow(fx - cx, 2) + Math.pow(fy - cy, 2));
                
                if(dist > fr + 20) return; // Ignore click if outside flashlight (+ tolerance)
            }

            let isCorrect = false;

            if (level.isSequence) {
                if (cardData.isTarget && cardData.id === level.targets[gameState.sequenceStep].id) {
                    isCorrect = true;
                    gameState.sequenceStep++;
                }
            } else {
                if (cardData.isTarget) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                // Correct target
                audio.playLock();
                cardEl.classList.add('locked');
                cardEl.querySelector('button').innerText = 'ĐÃ KHÓA';
                cardEl.querySelector('button').className = 'mt-2 text-xs bg-green-500 text-white px-3 py-1 rounded-full font-bold shadow';
                
                showFloatingText("+100", e.clientX, e.clientY, "text-green-400");
                
                gameState.score += 100 * gameState.combo;
                gameState.combo++;
                if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
                gameState.correctCount++;
                gameState.foundTargets++;

                updateHUD();

                if (gameState.foundTargets === level.targets.length) {
                    levelComplete(level);
                }
            } else {
                // Wrong target / Noise
                audio.playWrong();
                cardEl.classList.add('animate-shake', 'border-red-500');
                setTimeout(() => cardEl.classList.remove('animate-shake', 'border-red-500'), 500);
                
                showFloatingText("TÍN HIỆU NHIỄU!", e.clientX, e.clientY, "text-red-500");
                
                gameState.combo = 1;
                gameState.wrongCount++;
                if(cardData.review) gameState.reviewNotes.add(cardData.review); // Save for end screen
                
                // Score penalty but min 0
                gameState.score = Math.max(0, gameState.score - 20);
                
                // If sequence, inform them
                if (level.isSequence && cardData.isTarget) {
                    showFloatingText("SAI THỨ TỰ!", e.clientX, e.clientY + 30, "text-yellow-400");
                }
                
                updateHUD();
            }
        }

        function showFloatingText(text, x, y, colorClass) {
            const el = document.createElement('div');
            el.className = `floating-text ${colorClass}`;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.innerText = text;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function updateHUD() {
            hud.name.innerText = `${gameState.player.name} (${gameState.player.class})`;
            hud.score.innerText = gameState.score;
            hud.combo.innerText = `x${gameState.combo}`;
            if(gameState.combo > 1) {
                hud.combo.classList.add('animate-popup');
                setTimeout(() => hud.combo.classList.remove('animate-popup'), 300);
            }
        }

        function handleTimeOut() {
            gameState.isPlaying = false;
            audio.playWrong();
            clearInterval(gameState.timerInterval);
            
            screens.msg.classList.remove('hidden');
            screens.msg.classList.add('flex');
            document.getElementById('msg-title').innerText = "HẾT GIỜ!";
            document.getElementById('msg-title').className = "text-5xl md:text-7xl font-black mb-4 text-center text-red-500 animate-shake";
            document.getElementById('msg-sub').innerText = "Mục tiêu đã trốn thoát...";

            setTimeout(() => {
                screens.msg.classList.add('hidden');
                // Auto restart this level or move to end? Let's just finish game for punishment, or let them continue?
                // Better UX: Show Boss failure then end game.
                endGame();
            }, 2000);
        }

        function levelComplete(level) {
            gameState.isPlaying = false;
            clearInterval(gameState.timerInterval);
            audio.playCorrect();
            
            // Give time bonus
            if(gameState.timer > 0) {
                const bonus = gameState.timer * 10;
                gameState.score += bonus;
                showFloatingText(`Thưởng thời gian: +${bonus}`, window.innerWidth/2, window.innerHeight/2, "text-yellow-400");
                updateHUD();
            }

            setTimeout(() => {
                if (gameState.levelIndex < LEVEL_DATA.length - 1) {
                    startLevel(gameState.levelIndex + 1);
                } else {
                    endGame(true);
                }
            }, 1500);
        }

        function endGame(isWin = false) {
            gameState.isPlaying = false;
            clearInterval(gameState.timerInterval);
            audio.stopBgm();
            
            if(isWin) audio.playWin();
            
            screens.game.classList.add('hidden');
            hud.container.classList.remove('flex');
            hud.container.classList.add('hidden');
            
            screens.result.classList.remove('hidden');
            screens.result.classList.add('flex');
            
            document.getElementById('res-score').innerText = gameState.score;
            document.getElementById('res-combo').innerText = `x${gameState.maxCombo}`;
            document.getElementById('res-correct').innerText = gameState.correctCount;
            document.getElementById('res-wrong').innerText = gameState.wrongCount;
            
            const reviewList = document.getElementById('res-review');
            reviewList.innerHTML = '';
            
            if (gameState.reviewNotes.size > 0) {
                gameState.reviewNotes.forEach(note => {
                    const li = document.createElement('li');
                    li.innerText = note;
                    reviewList.appendChild(li);
                });
            } else {
                reviewList.innerHTML = '<li class="text-green-400">Hoàn hảo! Em đã nắm rất vững kiến thức Bài 8A!</li>';
            }
        }

        function resetGameState() {
            gameState.score = 0;
            gameState.combo = 1;
            gameState.maxCombo = 1;
            gameState.correctCount = 0;
            gameState.wrongCount = 0;
            gameState.reviewNotes.clear();
        }

        // Buttons
        document.getElementById('btn-restart').addEventListener('click', () => {
            audio.playLock();
            screens.result.classList.remove('flex');
            screens.result.classList.add('hidden');
            screens.game.classList.remove('hidden');
            hud.container.classList.remove('hidden');
            hud.container.classList.add('flex');
            resetGameState();
            updateHUD();
            startLevel(0);
        });

        document.getElementById('btn-home').addEventListener('click', () => {
            audio.playLock();
            screens.result.classList.remove('flex');
            screens.result.classList.add('hidden');
            screens.intro.classList.remove('hidden');
            screens.intro.classList.add('flex');
            document.getElementById('player-name').value = '';
            document.getElementById('player-class').value = '';
        });

        document.getElementById('btn-music').addEventListener('click', (e) => {
            const isOn = audio.toggleMusic();
            e.target.innerText = isOn ? '🎵' : '🔇';
            e.target.classList.toggle('bg-slate-700', isOn);
            e.target.classList.toggle('bg-red-900/50', !isOn);
        });

        document.getElementById('btn-sfx').addEventListener('click', (e) => {
            const isOn = audio.toggleSfx();
            e.target.innerText = isOn ? '🔊' : '🔈';
            e.target.classList.toggle('bg-slate-700', isOn);
            e.target.classList.toggle('bg-red-900/50', !isOn);
        });

    </script>
</body>
</html>
