<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Móc Dây Kiến Thức</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF69B4; /* Hot Pink */
            --secondary: #DA70D6; /* Orchid */
            --accent: #FFB6C1; /* Light Pink */
            --bg-top: #FFE4E1; /* Misty Rose */
            --bg-bottom: #FFF0F5; /* Lavender Blush */
            --text-dark: #4A0E4E;
            --success: #00C851;
            --danger: #ff4444;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-bottom);
            touch-action: none; /* Prevent scroll on mobile drag */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
            z-index: 20;
            transition: opacity 0.5s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            border: 2px solid white;
            text-align: center;
            max-width: 90%;
            width: 400px;
        }

        h1, h2 {
            color: var(--primary);
            text-shadow: 2px 2px 0px white;
            margin-top: 0;
        }

        h1 { font-size: 2.5rem; font-weight: 900; }
        h2 { font-size: 2rem; }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0 20px 0;
            border: 2px solid var(--accent);
            border-radius: 15px;
            font-size: 1.1rem;
            outline: none;
            box-sizing: border-box;
            background: white;
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,105,180,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255,105,180,0.6);
        }

        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        .badge {
            background: rgba(255,255,255,0.9);
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 2px solid white;
        }

        #question-banner {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            padding: 15px 30px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--text-dark);
            box-shadow: 0 5px 20px rgba(255,105,180,0.2);
            border: 2px solid white;
            text-align: center;
            max-width: 90%;
            width: max-content;
            font-size: 1.1rem;
        }

        .audio-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: white;
            border: 2px solid var(--accent);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
            text-align: left;
            color: var(--text-dark);
            font-weight: bold;
        }

        .stats-grid div {
            background: rgba(255,255,255,0.5);
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Màn hình Nhập Thông Tin -->
    <div id="login-screen" class="screen">
        <div class="glass-panel">
            <h1>MÓC DÂY<br>KIẾN THỨC</h1>
            <p style="color: var(--text-dark); margin-bottom: 20px; font-weight: bold;">Sẵn sàng chinh phục đỉnh cao?</p>
            <input type="text" id="playerName" placeholder="Biệt danh (không nhập tên thật)" required>
            <input type="text" id="playerClass" placeholder="Nhập Lớp (VD: 5A)" required>
            <button id="btn-start">BẮT ĐẦU CHƠI</button>
        </div>
    </div>

    <!-- Màn hình Kết Quả -->
    <div id="end-screen" class="screen hidden">
        <div class="glass-panel">
            <h2>CHINH PHỤC ĐỈNH KIẾN THỨC!</h2>
            <p id="end-greeting" style="font-size: 1.2rem; color: var(--primary); font-weight: bold;"></p>
            <div class="stats-grid">
                <div id="stat-score">Tổng điểm: 0</div>
                <div id="stat-combo">Combo max: 0</div>
                <div id="stat-hits">Bám đúng: 0</div>
                <div id="stat-misses">Móc trượt: 0</div>
            </div>
            <p style="color: var(--text-dark); font-size: 0.9rem; margin-bottom: 20px;">
                *Kiến thức cần ôn lại: Hãy xem lại thao tác ở những mốc em móc trượt nhé!
            </p>
            <button id="btn-replay">CHƠI LẠI</button>
            <button id="btn-home" style="background: white; color: var(--primary); border: 2px solid var(--primary); margin-left: 10px;">TRANG CHỦ</button>
        </div>
    </div>

    <!-- Lớp phủ UI trong Game -->
    <div id="game-ui" class="hidden">
        <div class="top-bar">
            <div class="badge" id="hud-score">Điểm: 0 | Combo: 0</div>
            <div class="badge" id="hud-level">Màn 1</div>
        </div>
        <div id="question-banner">Nhiệm vụ ở đây</div>
        
        <div class="audio-controls">
            <button class="icon-btn" id="btn-bgm" title="Bật/Tắt Nhạc nền">🎵</button>
            <button class="icon-btn" id="btn-sfx" title="Bật/Tắt Hiệu ứng">🔊</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // Dữ liệu bám sát 100% nội dung PDF.
        const LEVEL_DATA = [
            {
                level: 1, type: 'normal', name: 'Màn 1: Khởi động',
                question: 'Bắn móc vào điểm bám giúp "trình bày văn bản đẹp hơn, dễ đọc, dễ ghi nhớ".',
                targets: [
                    { text: 'Định dạng kí tự', correct: true },
                    { text: 'Gõ tiếng Việt', correct: false }
                ]
            },
            {
                level: 2, type: 'moving', name: 'Màn 2: Chuyển động',
                question: 'Tìm nút lệnh dùng để thay đổi "Màu chữ".',
                targets: [
                    { text: 'Nút A (có gạch màu dưới)', correct: true },
                    { text: 'Nút B (Bold)', correct: false },
                    { text: 'Nút có số 14', correct: false }
                ]
            },
            {
                level: 3, type: 'distraction', name: 'Màn 3: Nhận diện lệnh',
                question: 'Nhóm lệnh [ B I U ] dùng để làm gì?',
                targets: [
                    { text: 'Thay đổi kiểu chữ', correct: true },
                    { text: 'Thay đổi màu chữ', correct: false },
                    { text: 'Thay đổi cỡ chữ', correct: false },
                    { text: 'Thay đổi phông chữ', correct: false }
                ]
            },
            {
                level: 4, type: 'sequence', name: 'Màn 4: Chuỗi kiến thức',
                question: 'Để định dạng kí tự, ta phải thực hiện THEO THỨ TỰ nào?',
                sequence: ['Chọn phần văn bản', 'Mở dải lệnh Home', 'Chọn nhóm lệnh Font'],
                targets: [] 
            },
            {
                level: 5, type: 'sequence_no_hint', name: 'Màn 5: Thử thách trí nhớ',
                question: 'Bắn ĐÚNG THỨ TỰ các bước đổi "Cỡ chữ"',
                sequence: ['Chọn phần văn bản', 'Mở dải lệnh Home', 'Nháy nút có số 14', 'Chọn kích thước mới'],
                targets: []
            },
            {
                level: 6, type: 'boss', name: 'VÁCH NÚI CUỐI CÙNG (BOSS)',
                question: 'Chuỗi 4 bước bắt buộc để "Thay đổi cách bố trí hình ảnh":',
                sequence: ['Chọn hình ảnh', 'Bấm Layout Options', 'Chọn cách bố trí', 'Kéo thả vị trí mới'],
                targets: []
            }
        ];

        // Hệ thống âm thanh an toàn, không bị kẹt hay nổ tiếng
        const sfx = {
            ctx: null,
            bgmInterval: null,
            sfxEnabled: true,
            bgmEnabled: true,
            
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            safeResume: function() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone: function(freq, type, duration, vol=0.1) {
                if (!this.sfxEnabled || !this.ctx) return;
                this.safeResume();
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                
                // Tránh tiếng nổ (pop) bằng cách tăng giảm âm lượng mượt mà
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.05);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playShoot: function() { this.playTone(400, 'triangle', 0.15, 0.1); },
            playHit: function() { 
                this.playTone(880, 'sine', 0.1, 0.1); 
                setTimeout(() => this.playTone(1320, 'sine', 0.2, 0.1), 100);
            },
            playMiss: function() { this.playTone(150, 'sawtooth', 0.3, 0.1); },
            playWinLevel: function() {
                [523, 659, 783, 1046].forEach((f, i) => { // C E G C (Hợp âm trưởng)
                    setTimeout(() => this.playTone(f, 'sine', 0.2, 0.1), i * 150);
                });
            },
            startBGM: function() {
                if (this.bgmInterval) clearInterval(this.bgmInterval);
                const notes = [392, 392, 440, 493, 493, 440, 392, 329]; // Giai điệu vui tươi
                let i = 0;
                this.bgmInterval = setInterval(() => {
                    if (this.bgmEnabled && this.ctx) {
                        this.safeResume();
                        
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(notes[i], this.ctx.currentTime);
                        
                        gain.gain.setValueAtTime(0, this.ctx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.03, this.ctx.currentTime + 0.05);
                        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
                        
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.3);
                        
                        i = (i + 1) % notes.length;
                    }
                }, 400);
            },
            stopBGM: function() {
                if (this.bgmInterval) {
                    clearInterval(this.bgmInterval);
                    this.bgmInterval = null;
                }
            }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = {
            name: '', class: '',
            currentLevel: 0, score: 0, combo: 0, maxCombo: 0,
            hits: 0, misses: 0, shots: 0,
            isPlaying: false
        };

        const GRAVITY = 0.25; // Trọng lực nhẹ hơn để dễ bắn
        
        // Hệ thống vật lý và đối tượng
        let player = { x: 0, y: 0, originX: 0, originY: 0 };
        let hook = { 
            x: 0, y: 0, vx: 0, vy: 0, 
            state: 'idle', // idle, flying, pulling, miss_returning
            attachedTarget: null 
        };
        let entities = { targets: [] };
        let floatingTexts = [];
        let sequenceIndex = 0;

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let currentMouseX = 0;
        let currentMouseY = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.originX = canvas.width / 2;
            player.originY = canvas.height - 60;
            
            if (hook.state === 'idle') {
                player.x = player.originX;
                player.y = player.originY;
                hook.x = player.x;
                hook.y = player.y;
            }
        }
        window.addEventListener('resize', resize);

        function loadLevel(levelIdx) {
            if(levelIdx >= LEVEL_DATA.length) {
                endGame();
                return;
            }
            gameState.currentLevel = levelIdx;
            const lvl = LEVEL_DATA[levelIdx];
            sequenceIndex = 0;
            
            document.getElementById('question-banner').innerHTML = `<span style="color:var(--primary);">${lvl.name}:</span><br>${lvl.question}`;
            document.getElementById('hud-level').innerText = `Màn ${levelIdx + 1}/${LEVEL_DATA.length}`;
            
            entities.targets = [];
            const isMobile = canvas.width < 600;
            
            let tData = lvl.targets;
            if(lvl.type === 'sequence' || lvl.type === 'boss' || lvl.type === 'sequence_no_hint') {
                tData = lvl.sequence.map((text, i) => ({ text: text, correct: true, seqIdx: i }));
                // Trộn ngẫu nhiên
                tData.sort(() => Math.random() - 0.5); 
            }

            const padding = isMobile ? 15 : 80;
            const targetWidth = isMobile ? (canvas.width / 2 - 30) : 150;
            const targetHeight = 65;
            const startY = 160; // Dưới câu hỏi

            tData.forEach((t, i) => {
                let x, y, speed = 0, dir = 1;
                
                if (isMobile) {
                    // Khe hở bắn tỉa (Zigzag dọc)
                    y = startY + i * 85;
                    if (i % 2 === 0) {
                        x = padding; // Sát trái
                    } else {
                        x = canvas.width - padding - targetWidth; // Sát phải
                    }
                    // Đảm bảo không văng khỏi màn hình
                    x = Math.max(10, Math.min(x, canvas.width - targetWidth - 10));
                } else {
                    // Vòng cung trên PC
                    const totalWidth = canvas.width - padding * 2 - targetWidth;
                    const step = tData.length > 1 ? totalWidth / (tData.length - 1) : 0;
                    x = padding + i * step;
                    y = startY + Math.sin((i / Math.max(1, tData.length - 1)) * Math.PI) * 40;
                }

                if (lvl.type === 'moving') {
                    speed = 1.5 + Math.random() * 2; // Tốc độ khác nhau
                    dir = i % 2 === 0 ? 1 : -1;      // Hướng đi ngược nhau
                }

                entities.targets.push({
                    ...t, x, y, w: targetWidth, h: targetHeight, speed, dir, hit: false
                });
            });
        }

        function getPointerPos(e) {
            if (e.touches) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function handlePointerDown(e) {
            if (!gameState.isPlaying || hook.state !== 'idle') return;
            const pos = getPointerPos(e);
            
            sfx.init(); // Khởi tạo AudioContext an toàn khi user click
            if(!sfx.bgmInterval) sfx.startBGM();

            isDragging = true;
            dragStartX = pos.x;
            dragStartY = pos.y;
            currentMouseX = pos.x;
            currentMouseY = pos.y;
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            const pos = getPointerPos(e);
            currentMouseX = pos.x;
            currentMouseY = pos.y;
        }

        function handlePointerUp() {
            if (!isDragging) return;
            isDragging = false;
            
            // Tính toán lực bắn kiểu Angry Birds (Kéo ngược hướng)
            let dx = dragStartX - currentMouseX;
            let dy = dragStartY - currentMouseY;
            let dist = Math.hypot(dx, dy);
            
            if (dist > 20) {
                let angle = Math.atan2(dy, dx);
                let power = Math.min(dist * 0.25, 28); // Lực kéo mạnh hơn
                
                hook.vx = Math.cos(angle) * power;
                hook.vy = Math.sin(angle) * power;
                hook.state = 'flying';
                gameState.shots++;
                sfx.playShoot();
            }
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        
        canvas.addEventListener('touchstart', handlePointerDown, {passive: true});
        canvas.addEventListener('touchmove', handlePointerMove, {passive: true});
        window.addEventListener('touchend', handlePointerUp);

        document.getElementById('btn-start').onclick = () => {
            const name = document.getElementById('playerName').value.trim();
            const cls = document.getElementById('playerClass').value.trim();
            if (name && cls) {
                gameState.name = name;
                gameState.class = cls;
                startGame();
            } else {
                alert('Em vui lòng nhập đủ Họ Tên và Lớp nhé!');
            }
        };

        document.getElementById('btn-replay').onclick = startGame;
        document.getElementById('btn-home').onclick = () => {
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            sfx.stopBGM();
        };

        document.getElementById('btn-bgm').onclick = function() {
            sfx.bgmEnabled = !sfx.bgmEnabled;
            this.style.opacity = sfx.bgmEnabled ? '1' : '0.5';
            if(sfx.bgmEnabled) sfx.startBGM(); else sfx.stopBGM();
        };

        document.getElementById('btn-sfx').onclick = function() {
            sfx.sfxEnabled = !sfx.sfxEnabled;
            this.style.opacity = sfx.sfxEnabled ? '1' : '0.5';
        };

        function updateUI() {
            document.getElementById('hud-score').innerText = `Điểm: ${gameState.score} | Combo: x${gameState.combo}`;
        }

        function showFloatingText(text, x, y, color, size=24) {
            floatingTexts.push({text, x, y, color, size, alpha: 1, dy: -2});
        }

        function updatePhysics() {
            if (!gameState.isPlaying) return;

            // Xử lý mục tiêu di chuyển (Màn 2)
            entities.targets.forEach(t => {
                if (t.speed > 0) {
                    t.x += t.speed * t.dir;
                    if (t.x < 10 || t.x + t.w > canvas.width - 10) {
                        t.dir *= -1; // Dội tường
                    }
                }
            });

            const lvl = LEVEL_DATA[gameState.currentLevel];

            // Trạng thái nghỉ: Kéo nhân vật mượt mà về vị trí gốc ở giữa
            if (hook.state === 'idle') {
                hook.x = player.x;
                hook.y = player.y;
                player.x += (player.originX - player.x) * 0.1;
                player.y += (player.originY - player.y) * 0.1;
            }

            // Trạng thái Móc bay ra
            if (hook.state === 'flying') {
                hook.vy += GRAVITY;
                hook.x += hook.vx;
                hook.y += hook.vy;
                
                // Móc bay ra khỏi màn hình -> Trượt
                if (hook.x < 0 || hook.x > canvas.width || hook.y > canvas.height) {
                    handleMiss();
                }
                
                // Kiểm tra va chạm (AABB Collision)
                for (let t of entities.targets) {
                    if (t.hit && (lvl.type === 'normal' || lvl.type === 'moving' || lvl.type === 'distraction')) continue; 
                    
                    if (hook.x > t.x && hook.x < t.x + t.w && hook.y > t.y && hook.y < t.y + t.h) {
                        hook.state = 'pulling';
                        hook.vx = 0;
                        hook.vy = 0;
                        hook.attachedTarget = t;
                        break;
                    }
                }
            }

            // Trạng thái Móc trượt, thu về nhanh
            if (hook.state === 'miss_returning') {
                let dx = player.x - hook.x;
                let dy = player.y - hook.y;
                let dist = Math.hypot(dx, dy);
                
                if (dist < 20) {
                    hook.state = 'idle';
                } else {
                    hook.x += dx * 0.15;
                    hook.y += dy * 0.15;
                }
                // Nhân vật cũng trượt về tâm
                player.x += (player.originX - player.x) * 0.05;
                player.y += (player.originY - player.y) * 0.05;
            }

            // Trạng thái Kéo nhân vật lên Điểm bám
            if (hook.state === 'pulling') {
                let dx = hook.attachedTarget.x + hook.attachedTarget.w/2 - player.x;
                let dy = hook.attachedTarget.y + hook.attachedTarget.h - player.y;
                let dist = Math.hypot(dx, dy);
                
                if (dist < 15) {
                    // Đã tới điểm bám
                    player.x = hook.attachedTarget.x + hook.attachedTarget.w/2;
                    player.y = hook.attachedTarget.y + hook.attachedTarget.h;
                    handleHitTarget(hook.attachedTarget);
                    
                    hook.state = 'idle'; // Reset về idle, tự trượt về tâm
                    checkLevelWin();
                } else {
                    // Bay lên
                    player.x += dx * 0.15;
                    player.y += dy * 0.15;
                    hook.x = player.x;
                    hook.y = player.y;
                }
            }
        }

        function handleMiss() {
            hook.state = 'miss_returning';
            gameState.misses++;
            gameState.combo = 0;
            sfx.playMiss();
            showFloatingText("MÓC TRƯỢT!", player.x, player.y - 40, varColor('--danger'));
            player.y += 40; // Hiệu ứng tụt xuống một chút do rơi
            updateUI();
        }

        function handleHitTarget(target) {
            const lvl = LEVEL_DATA[gameState.currentLevel];
            let isCorrect = false;

            if (lvl.type === 'sequence' || lvl.type === 'boss' || lvl.type === 'sequence_no_hint') {
                if (target.seqIdx === sequenceIndex) {
                    isCorrect = true;
                    target.hit = true;
                    sequenceIndex++;
                }
            } else {
                if (target.correct) {
                    isCorrect = true;
                    target.hit = true;
                }
            }

            if (isCorrect) {
                gameState.hits++;
                gameState.combo++;
                if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
                
                let points = 100 * gameState.combo;
                gameState.score += points;
                
                sfx.playHit();
                showFloatingText("MÓC THÀNH CÔNG! +" + points, player.x, player.y - 40, varColor('--success'));
            } else {
                handleMiss(); // Xử lý giống hệt như bắn hụt ra ngoài
            }
            updateUI();
        }

        function checkLevelWin() {
            const lvl = LEVEL_DATA[gameState.currentLevel];
            let won = false;
            
            if (lvl.type === 'sequence' || lvl.type === 'boss' || lvl.type === 'sequence_no_hint') {
                if (sequenceIndex >= lvl.sequence.length) won = true;
            } else {
                const correctTargets = entities.targets.filter(t => t.correct);
                if (correctTargets.every(t => t.hit)) won = true;
            }
            
            if (won) {
                setTimeout(() => {
                    sfx.playWinLevel();
                    gameState.currentLevel++;
                    
                    if (gameState.currentLevel >= LEVEL_DATA.length) {
                        endGame();
                    } else {
                        showFloatingText("QUA MÀN!", canvas.width/2, canvas.height/2, varColor('--primary'), 50);
                        setTimeout(() => loadLevel(gameState.currentLevel), 1500);
                    }
                }, 500);
            }
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lines = [];
            
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);
            
            let startY = y - ((lines.length - 1) * lineHeight) / 2;
            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i].trim(), x, startY + (i * lineHeight));
            }
        }

        function drawMountains() {
            // Background gradient
            let bgGrd = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrd.addColorStop(0, varColor('--bg-top'));
            bgGrd.addColorStop(1, varColor('--bg-bottom'));
            ctx.fillStyle = bgGrd;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Vách núi xa
            ctx.fillStyle = '#F8BBD0';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            ctx.lineTo(canvas.width * 0.3, canvas.height * 0.5);
            ctx.lineTo(canvas.width * 0.7, canvas.height);
            ctx.fill();

            // Vách núi gần
            ctx.fillStyle = '#F48FB1';
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.4, canvas.height);
            ctx.lineTo(canvas.width * 0.85, canvas.height * 0.4);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fill();
            
            // Mặt đất
            ctx.fillStyle = '#EC407A';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
        }

        function draw() {
            if (!gameState.isPlaying) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMountains();

            const lvl = LEVEL_DATA[gameState.currentLevel];

            // 1. Vẽ Dây Ngắm (Aim Line) - Hướng dẫn bắn
            if (isDragging && hook.state === 'idle') {
                let dx = dragStartX - currentMouseX;
                let dy = dragStartY - currentMouseY;
                let angle = Math.atan2(dy, dx);
                let dist = Math.hypot(dx, dy);
                let power = Math.min(dist * 0.25, 28);
                
                ctx.beginPath();
                ctx.moveTo(player.x, player.y - 15);
                let simX = player.x;
                let simY = player.y - 15;
                let simVx = Math.cos(angle) * power;
                let simVy = Math.sin(angle) * power;
                
                ctx.strokeStyle = 'rgba(255, 105, 180, 0.6)'; // Pink dot line
                ctx.lineWidth = 4;
                ctx.setLineDash([10, 15]);
                
                for (let i = 0; i < 25; i++) {
                    simVy += GRAVITY;
                    simX += simVx;
                    simY += simVy;
                    ctx.lineTo(simX, simY);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 2. Vẽ Dây Móc thật
            if (hook.state !== 'idle') {
                ctx.beginPath();
                ctx.moveTo(player.x, player.y - 15);
                ctx.lineTo(hook.x, hook.y);
                ctx.strokeStyle = varColor('--text-dark');
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // 3. Vẽ Khối Đáp Án (Glassmorphism 3D)
            entities.targets.forEach(t => {
                if (t.hit && (lvl.type === 'normal' || lvl.type === 'moving' || lvl.type === 'distraction')) return;
                
                if (t.hit) ctx.globalAlpha = 0.3; // Làm mờ các khối đã bắn đúng ở màn Sequence

                // Gradient nền
                let grd = ctx.createLinearGradient(t.x, t.y, t.x, t.y + t.h);
                if (lvl.type === 'boss') {
                    grd.addColorStop(0, '#FFE066'); // Vàng Gold cho Boss
                    grd.addColorStop(1, '#F5B041');
                } else {
                    grd.addColorStop(0, '#FF9A9E'); // Hồng phấn
                    grd.addColorStop(1, '#FECFEF');
                }

                // Bóng đổ mặc định (Đã xoá gợi ý hào quang cho tất cả các màn)
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 5;

                // Vẽ Khối Bo góc
                ctx.fillStyle = grd;
                ctx.beginPath();
                ctx.roundRect(t.x, t.y, t.w, t.h, 15);
                ctx.fill();

                // Tắt bóng đổ để vẽ Highlight
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // Glass Highlight (Nửa trên sáng bóng)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.roundRect(t.x, t.y, t.w, t.h * 0.4, {tl: 15, tr: 15, bl: 0, br: 0});
                ctx.fill();

                // Vẽ Text
                ctx.fillStyle = varColor('--text-dark');
                ctx.font = 'bold 14px "Inter", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Wrap text tự động
                drawWrappedText(ctx, t.text, t.x + t.w/2, t.y + t.h/2, t.w - 10, 20);
                
                ctx.globalAlpha = 1.0;
            });

            // 4. Vẽ Đầu móc câu (Làm to, đẹp và bắt mắt hơn)
            if (hook.state !== 'idle') {
                // Hiệu ứng xoay móc câu khi đang bay
                let angleOffset = (hook.state === 'flying' || hook.state === 'miss_returning') ? Date.now() / 150 : 0;
                
                // Vòng ngoài kim loại
                ctx.fillStyle = '#E0E0E0'; 
                ctx.beginPath();
                ctx.arc(hook.x, hook.y, 16, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#757575';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Lõi phát sáng bên trong
                ctx.fillStyle = varColor('--primary');
                ctx.beginPath();
                ctx.arc(hook.x, hook.y, 8, 0, Math.PI * 2);
                ctx.fill();

                // Vẽ 3 móng vuốt bám (ngàm)
                ctx.strokeStyle = '#BDBDBD';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                for (let i = 0; i < 3; i++) {
                    let angle = (i * (Math.PI * 2 / 3)) + angleOffset;
                    ctx.beginPath();
                    ctx.moveTo(hook.x + Math.cos(angle) * 16, hook.y + Math.sin(angle) * 16);
                    ctx.lineTo(hook.x + Math.cos(angle) * 26, hook.y + Math.sin(angle) * 26);
                    ctx.lineTo(hook.x + Math.cos(angle + 0.5) * 32, hook.y + Math.sin(angle + 0.5) * 32);
                    ctx.stroke();
                }
            }

            // 5. Vẽ Nhân vật (Cậu bé leo núi)
            ctx.fillStyle = varColor('--primary');
            ctx.beginPath();
            ctx.arc(player.x, player.y - 20, 20, 0, Math.PI * 2); // Thân/Đầu
            ctx.fill();
            
            // Mắt kính bảo hộ
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.roundRect(player.x - 12, player.y - 28, 24, 12, 5);
            ctx.fill();
            ctx.fillStyle = varColor('--text-dark');
            ctx.beginPath();
            ctx.arc(player.x - 5, player.y - 22, 3, 0, Math.PI * 2);
            ctx.arc(player.x + 5, player.y - 22, 3, 0, Math.PI * 2);
            ctx.fill();

            // 6. Vẽ Floating Texts (Điểm số bay lên)
            floatingTexts.forEach((ft, i) => {
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = `bold ${ft.size}px "Inter", sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                
                ft.y += ft.dy;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            });
            ctx.globalAlpha = 1;
        }

        function gameLoop() {
            updatePhysics();
            draw();
            if (gameState.isPlaying) requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            
            gameState = {
                ...gameState,
                currentLevel: 0, score: 0, combo: 0, maxCombo: 0,
                hits: 0, misses: 0, shots: 0,
                isPlaying: true
            };
            
            floatingTexts = [];
            hook.state = 'idle';
            isDragging = false;
            
            resize();
            loadLevel(0);
            updateUI();
            
            sfx.init();
            sfx.startBGM();
            
            gameLoop();
        }

        function endGame() {
            gameState.isPlaying = false;
            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            
            document.getElementById('end-greeting').innerText = `Chúc mừng ${gameState.name} - Lớp ${gameState.class}!`;
            document.getElementById('stat-score').innerText = `Tổng điểm: ${gameState.score}`;
            document.getElementById('stat-combo').innerText = `Combo Max: x${gameState.maxCombo}`;
            document.getElementById('stat-hits').innerText = `Bám đúng: ${gameState.hits}`;
            document.getElementById('stat-misses').innerText = `Móc trượt: ${gameState.misses}`;
            
            sfx.stopBGM();
            sfx.playWinLevel();
        }

        // Khởi tạo layout ban đầu
        resize();
    </script>
</body>
</html>
